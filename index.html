<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape The Unknown - المتاهة المضيئة</title>
    
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="danger-overlay"></div>
    <div id="crosshair"></div>
    <div id="toast-msg"></div>

    <div id="menu">
        <h1>👁️ البقاء على قيد الحياة 👁️</h1>
        <p>اتبع الشموع المضيئة على الجدران لإيجاد طريقك. استخدم الباركور والسرعة للهرب من الوحش!</p>
        <button class="btn-main" onclick="startGame()">بدء التحدي 🏃‍♂️💀</button>
    </div>

    <div id="hud">
        <div class="hud-card">
            <span>⚡ الطاقة:</span>
            <div class="bar-container"><div id="stamina-bar"></div></div>
        </div>
        <div class="hud-card">
            <span>🔦 البطارية:</span>
            <div class="bar-container"><div id="battery-bar"></div></div>
        </div>
        <div class="hud-card">
            <span>🔑 الهدف:</span>
            <span id="hud-status" style="color: #ef4444;">اتبع الشموع للمخرج</span>
        </div>
    </div>

    <div id="inventory-bar">
        <div class="inv-slot active" id="slot-0">🔦</div>
        <div class="inv-slot" id="slot-1">---</div>
        <div class="inv-slot" id="slot-2">---</div>
    </div>

    <div id="controls-hint">
        [W,A,S,D] حركة | [Click/Shift] جري | [Space] قفز | [C] انزلاق | [F] مصباح | [E] تفاعل
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, flashlight, ambientLight;
        let isGameStarted = false;

        function showToast(text) {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text;
            msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2500);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a10); // خلفية أوضح قليلاً

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // زيادة الإضاءة المحيطة لتسهيل رؤية الخريطة
            ambientLight = new THREE.AmbientLight(0xffffff, 0.45); 
            scene.add(ambientLight);

            // المصباح اليدوي
            flashlight = new THREE.SpotLight(0xfffaed, 6, 50, Math.PI / 3, 0.4);
            scene.add(flashlight);
            scene.add(flashlight.target);

            // إصلاح خطأ PointerLock المستمر
            window.addEventListener('click', () => {
                if (isGameStarted && document.pointerLockElement !== document.body) {
                    try {
                        document.body.requestPointerLock();
                    } catch (err) {
                        console.log("Pointer lock waiting...");
                    }
                }
            });

            createCandlesAndMaze();
        }

        // إضافة الشموع والمتاهة المضيئة
        function createCandlesAndMaze() {
            const floor = new THREE.Mesh(
                new THREE.BoxGeometry(100, 1, 100),
                new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 })
            );
            floor.position.set(0, -0.5, 0);
            scene.add(floor);

            // مواضع الشموع المضيئة لإرشاد اللاعب
            const candlePositions = [
                { x: 0, z: 15 }, { x: -10, z: 0 }, { x: 10, z: -10 }, { x: 0, z: -25 }
            ];

            candlePositions.forEach(pos => {
                // شعلة شمعة
                const candleLight = new THREE.PointLight(0xff7700, 3, 12);
                candleLight.position.set(pos.x, 2, pos.z);
                scene.add(candleLight);

                // مجسم الشمعة المضيء
                const candleMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.1, 0.1, 0.6),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                candleMesh.position.set(pos.x, 1.8, pos.z);
                scene.add(candleMesh);
            });
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            isGameStarted = true;
            initScene();
            
            playerGroup = new THREE.Group();
            playerGroup.position.set(0, 1.8, 25);
            scene.add(playerGroup);

            try {
                document.body.requestPointerLock();
            } catch(e){}

            showToast("⚠️ اتبع الشموع المضيئة للهروب!");
        }
    </script>
</body>
</html>
