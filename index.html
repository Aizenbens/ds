<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>From What?</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; overflow: hidden; background: #020208; user-select: none; touch-action: none; }
        
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 20px;
            border-radius: 24px; color: #f8fafc; text-align: center;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.5);
            border: 2px solid rgba(220, 38, 38, 0.6);
            z-index: 10; width: 92%; max-width: 460px; max-height: 95vh; overflow-y: auto;
            backdrop-filter: blur(16px); display: flex; flex-direction: column; gap: 10px;
        }

        #menu h1 { margin: 0; color: #ef4444; text-shadow: 0 0 12px #991b1b; font-size: 26px; font-weight: 900; }
        
        .preview-container {
            width: 100%; height: 160px; background: #05070f; border-radius: 16px;
            border: 1px solid #1e293b; position: relative; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .tabs { display: flex; gap: 8px; justify-content: center; }
        .tab-btn {
            flex: 1; padding: 8px; background: #1e293b; color: #94a3b8;
            border: 1px solid #334155; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: #ef4444; color: white; border-color: #f87171; }

        .form-group { text-align: right; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; color: #94a3b8; font-size: 12px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #334155;
            background: #0f172a; color: white; font-size: 13px; outline: none;
        }

        .color-row { display: flex; gap: 8px; }
        .color-row div { flex: 1; }

        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 5px; }
        .shop-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
        }
        .shop-card button {
            background: #22c55e; border: none; color: white; padding: 4px 8px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 10px; width: 100%;
        }

        button.btn-main {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white; border: none; padding: 12px; border-radius: 12px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        #hud {
            position: absolute; top: 12px; right: 12px; left: 12px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 12px; font-weight: bold; z-index: 5; flex-wrap: wrap; gap: 8px;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); padding: 6px 12px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px;
        }

        #action-btn-container {
            position: absolute; bottom: 15px; left: 15px; z-index: 6;
            display: flex; gap: 8px;
        }

        .action-btn {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #ef4444;
            color: white; padding: 10px 16px; border-radius: 12px;
            font-size: 13px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px);
        }

        #win-modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 25px;
            border-radius: 20px; color: white; text-align: center;
            border: 2px solid #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            z-index: 20; width: 85%; max-width: 340px;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 4;
            border: 2px solid rgba(255,255,255,0.6); border-radius: 50%;
        }

        #toast-msg {
            position: absolute; top: 10%; left: 50%; transform: translate(-50%, -50%);
            color: #ef4444; font-size: 13px; font-weight: bold; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none;
            background: rgba(15, 23, 42, 0.95); padding: 8px 18px; border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.5); z-index: 6; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="menu">
        <h1>🔥 From What? 🔥</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('custom')">التخصيص</button>
            <button class="tab-btn" onclick="switchTab('shop')">المتجر 🛒</button>
        </div>

        <div class="preview-container" id="shop-preview"></div>

        <div id="tab-custom">
            <div class="color-row">
                <div class="form-group">
                    <label>القميص:</label>
                    <input type="color" id="shirt-color-input" value="#ef4444" onchange="updateShopPreview()">
                </div>
                <div class="form-group">
                    <label>السروال:</label>
                    <input type="color" id="pants-color-input" value="#0f172a" onchange="updateShopPreview()">
                </div>
                <div class="form-group">
                    <label>الشعر:</label>
                    <input type="color" id="hair-color-input" value="#f59e0b" onchange="updateShopPreview()">
                </div>
            </div>

            <div class="color-row">
                <div class="form-group">
                    <label>المستوى (1 - 40):</label>
                    <select id="level-select"></select>
                </div>
            </div>
        </div>

        <div id="tab-shop" style="display: none;">
            <div class="shop-grid">
                <div class="shop-card">
                    <span>🔥 سكن الحمم</span>
                    <span>100 عملة</span>
                    <button onclick="buySkin('lava', 100)">شراء / تجهيز</button>
                </div>
                <div class="shop-card">
                    <span>⚡ سكن البرق</span>
                    <span>250 عملة</span>
                    <button onclick="buySkin('lightning', 250)">شراء / تجهيز</button>
                </div>
                <div class="shop-card">
                    <span>🗿 سكن الصخر</span>
                    <span>400 عملة</span>
                    <button onclick="buySkin('rock', 400)">شراء / تجهيز</button>
                </div>
            </div>
        </div>

        <button class="btn-main" onclick="startGame()">ابدأ اللعب الآن 🏃‍♂️</button>
    </div>

    <div id="hud">
        <div class="hud-card">💰 <span id="hud-coins" style="color: #facc15;">0</span></div>
        <div class="hud-card">🔑 <span id="hud-key1" style="color: #ef4444;">❌</span></div>
        <div class="hud-card">💀 <span id="hud-deaths" style="color: #ef4444;">0</span></div>
        <div class="hud-card">📍 مرحلة: <span id="hud-level" style="color: #facc15;">1</span> / 40</div>
    </div>

    <div id="action-btn-container">
        <button class="action-btn" onclick="triggerDash()">⚡ اندفاع (Shift)</button>
    </div>

    <div id="win-modal">
        <h2>🏆 هربت بنجاح!</h2>
        <p>اجتزت العقبات والوحش المطارد!</p>
        <button class="btn-main" onclick="nextLevelAction()">المرحلة التالية ⏩</button>
    </div>

    <div id="toast-msg"></div>

    <script>
        let savedLevel = parseInt(localStorage.getItem('fw_level')) || 1;
        let savedCoins = parseInt(localStorage.getItem('fw_coins')) || 0;
        let ownedSkins = JSON.parse(localStorage.getItem('fw_skins')) || ['default'];
        let equippedSkin = localStorage.getItem('fw_equipped_skin') || 'default';

        const levelSelect = document.getElementById('level-select');
        for (let i = 1; i <= 40; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = i <= 30 ? `باركور ${i}` : `متاهة ${i - 30}`;
            if (i === savedLevel) opt.selected = true;
            levelSelect.appendChild(opt);
        }

        let scene, camera, renderer;
        let previewScene, previewCamera, previewRenderer, previewPlayerGroup;
        let playerGroup;
        let monsterGroup = null;
        let platforms = [], coinsArr = [], checkpoints = [];
        let key1Obj = null, roomDoorObj = null, endPlatformMesh = null;
        
        let lastCheckpointPos = { x: 0, y: 3, z: 0 };
        let hasKey1 = false, deathCount = 0, coinsCount = savedCoins;
        let isDying = false;
        
        let currentLevel = savedLevel;
        let isGrounded = false;
        let jumpsLeft = 2; const maxJumps = 2;
        let canDash = true;

        let audioCtx = null;
        let animTime = 0;
        const gravity = 0.016;
        let velocity = { x: 0, y: 0, z: 0 };
        let targetVelocity = { x: 0, z: 0 };
        let baseSpeed = 0.22;
        let jumpForce = 0.38;
        let monsterSpeed = 0.16;
        const keys = {};

        // زوايا التحكم بالرؤية بمنظور الشخص الأول
        let pitch = 0, yaw = 0;
        const playerSize = { w: 0.8, h: 1.8, d: 0.8 };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function switchTab(tab) {
            document.getElementById('tab-custom').style.display = tab === 'custom' ? 'block' : 'none';
            document.getElementById('tab-shop').style.display = tab === 'shop' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function buySkin(skinName, cost) {
            if (ownedSkins.includes(skinName)) {
                equippedSkin = skinName;
                localStorage.setItem('fw_equipped_skin', equippedSkin);
                showToast("تم تجهيز السكن!");
                updateShopPreview();
                return;
            }

            if (coinsCount >= cost) {
                coinsCount -= cost;
                ownedSkins.push(skinName);
                equippedSkin = skinName;
                localStorage.setItem('fw_coins', coinsCount);
                localStorage.setItem('fw_skins', JSON.stringify(ownedSkins));
                localStorage.setItem('fw_equipped_skin', equippedSkin);
                document.getElementById('hud-coins').textContent = coinsCount;
                showToast("مبروك! تم شراء السكن 🎉");
                updateShopPreview();
            } else {
                showToast("العملات غير كافية!");
            }
        }

        function initShopPreview() {
            const container = document.getElementById('shop-preview');
            previewScene = new THREE.Scene();
            previewScene.background = new THREE.Color(0x05070f);

            previewCamera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
            previewCamera.position.set(0, 1.2, 3.2);

            previewRenderer = new THREE.WebGLRenderer({ antialias: true });
            previewRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(previewRenderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(2, 4, 3);
            previewScene.add(light);
            previewScene.add(new THREE.AmbientLight(0xffffff, 0.6));

            updateShopPreview();
            animateShopPreview();
        }

        function buildPlayerMesh() {
            const group = new THREE.Group();
            let skinColor = 0xffdbac, shirtColor = document.getElementById('shirt-color-input').value;

            if (equippedSkin === 'lava') { skinColor = 0xef4444; shirtColor = 0x7f1d1d; }
            else if (equippedSkin === 'lightning') { skinColor = 0x38bdf8; shirtColor = 0x0284c7; }
            else if (equippedSkin === 'rock') { skinColor = 0x475569; shirtColor = 0x1e293b; }

            const mat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), mat);
            body.position.y = 0.9;
            group.add(body);
            return group;
        }

        function updateShopPreview() {
            if (previewPlayerGroup) previewScene.remove(previewPlayerGroup);
            previewPlayerGroup = buildPlayerMesh();
            previewScene.add(previewPlayerGroup);
        }

        function animateShopPreview() {
            requestAnimationFrame(animateShopPreview);
            if (previewPlayerGroup) previewPlayerGroup.rotation.y += 0.02;
            if (previewRenderer) previewRenderer.render(previewScene, previewCamera);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xff5555, 0.6);
            scene.add(ambientLight);

            // تحكم بالماوس لنظام الشخص الأول (First Person Controls)
            document.body.addEventListener('click', () => {
                if (document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.0025;
                    pitch -= e.movementY * 0.0025;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                }
            });

            window.addEventListener('keydown', e => {
                initAudio();
                const key = e.key.toLowerCase();
                keys[key] = true;
                if (e.code === 'ShiftLeft' || key === 'shift') triggerDash();
                if (e.code === 'Space' && !isDying) simulateJump();
            });

            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function simulateJump() {
            if (isGrounded) {
                velocity.y = jumpForce; isGrounded = false; jumpsLeft = maxJumps - 1;
                playSound(320, 'square', 0.15);
            } else if (jumpsLeft > 0) {
                velocity.y = jumpForce * 0.85; jumpsLeft--;
                playSound(450, 'triangle', 0.2);
            }
        }

        function createChasingMonster() {
            if (monsterGroup) scene.remove(monsterGroup);
            monsterGroup = new THREE.Group();

            const mat = new THREE.MeshStandardMaterial({ color: 0x280000, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.6, 1.8), mat); body.position.y = 1.8;
            const eye = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.2), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            eye.position.set(0, 3.0, -0.9);

            monsterGroup.add(body, eye);
            monsterGroup.position.set(0, 0, 10);
            scene.add(monsterGroup);

            monsterSpeed = 0.15 + (currentLevel * 0.003);
        }

        function createStylizedPlatform(x, y, z, w, h, d, colorHex, type = 'normal') {
            const group = new THREE.Group();
            const mainMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 });
            const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mainMat);
            group.add(mainMesh);

            group.position.set(x, y, z);
            scene.add(group);

            platforms.push({ 
                mesh: mainMesh, group: group, type: type, 
                size: { w, h, d }, pos: { x, y, z }
            });
            return group;
        }

        function buildMazeLevel(levelNum) {
            // تصميم متاهات معقدة ومظلمة (المراحل 31-40)
            const mazeSize = 12 + (levelNum - 30) * 2;
            const unit = 4;

            for (let r = 0; r < mazeSize; r++) {
                for (let c = 0; c < mazeSize; c++) {
                    if (Math.random() > 0.4 || r === 0 || c === 0 || r === mazeSize - 1 || c === mazeSize - 1) {
                        createStylizedPlatform((r - mazeSize / 2) * unit, 2, (c - mazeSize / 2) * unit, unit, 5, unit, 0x0f172a);
                    }
                }
            }

            // أرضية المتاهة الممتدة
            createStylizedPlatform(0, -0.5, 0, mazeSize * unit, 1, mazeSize * unit, 0x1e293b);
            createEndRoomWithPortal(0, 0, -(mazeSize / 2) * unit + 4);
        }

        function buildCaveLevel(levelNum) {
            platforms.forEach(p => scene.remove(p.group));
            coinsArr.forEach(cn => scene.remove(cn.mesh));
            if (key1Obj) scene.remove(key1Obj);
            if (roomDoorObj) scene.remove(roomDoorObj);

            platforms = []; coinsArr = []; checkpoints = [];

            if (levelNum > 30) {
                buildMazeLevel(levelNum);
                createChasingMonster();
                return;
            }

            const mapLength = 25 + Math.floor(levelNum * 1.8);
            let currentZ = 0, currentY = 0, currentX = 0;

            createStylizedPlatform(0, 0, 0, 8, 1.4, 8, 0x1e293b);

            for (let i = 0; i < mapLength; i++) {
                const gapZ = 6.8 + (levelNum * 0.06); 
                const stepY = (Math.sin(i * 0.6) * 1.1); 
                const shiftX = (Math.cos(i * 0.7) * 4.5); 

                currentZ -= gapZ; currentY += stepY; currentX = shiftX;

                const pWidth = Math.max(2.8, 5.0 - (levelNum * 0.08));
                createStylizedPlatform(currentX, currentY, currentZ, pWidth, 1.2, pWidth, 0x1e293b);
            }

            createEndRoomWithPortal(currentX, currentY, currentZ - 10);
            createChasingMonster();
        }

        function createEndRoomWithPortal(x, y, z) {
            roomDoorObj = new THREE.Group();
            roomDoorObj.position.set(x, y, z);

            // المنصة النهائية المستقرة
            endPlatformMesh = new THREE.Mesh(new THREE.BoxGeometry(10, 1.5, 10), new THREE.MeshStandardMaterial({ color: 0x1e1b4b }));
            endPlatformMesh.position.set(0, 0, 0);

            const portalRing = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.25, 12, 24), new THREE.MeshBasicMaterial({ color: 0x22c55e }));
            portalRing.position.set(0, 3.2, 0); portalRing.name = "finish";

            roomDoorObj.add(endPlatformMesh, portalRing);
            scene.add(roomDoorObj);

            // تسجيل المنصة النهائية في الفيزيائيات لمنع أي سقوط!
            platforms.push({
                mesh: endPlatformMesh, group: roomDoorObj, type: 'normal',
                size: { w: 10, h: 1.5, d: 10 }, pos: { x, y, z }
            });
        }

        function triggerDash() {
            if (!canDash || isDying) return;
            canDash = false;
            playSound(600, 'sawtooth', 0.1);
            velocity.z -= 0.55;
            setTimeout(() => { canDash = true; }, 1000);
        }

        function startGame() {
            initAudio();
            currentLevel = parseInt(document.getElementById('level-select').value);

            document.getElementById('hud-level').textContent = currentLevel;
            document.getElementById('hud-coins').textContent = coinsCount;
            document.getElementById('menu').style.display = 'none';

            if (!scene) initScene();

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            buildCaveLevel(currentLevel);
            respawnPlayer();
            animate();
        }

        function triggerDeathAnimation() {
            if (isDying) return;
            isDying = true; deathCount++;
            playSound(150, 'sawtooth', 0.3);
            document.getElementById('hud-deaths').textContent = deathCount;
            
            setTimeout(() => {
                isDying = false;
                respawnPlayer();
            }, 400);
        }

        function respawnPlayer() {
            playerGroup.position.set(0, 2.5, 0);
            velocity = { x: 0, y: 0, z: 0 };
            yaw = 0; pitch = 0;
            if (monsterGroup) monsterGroup.position.set(0, 0, 14);
        }

        function showToast(text) {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text; msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 1800);
        }

        function openWinModal() {
            confetti({ particleCount: 100, spread: 70 });
            playSound(580, 'sine', 0.4);
            localStorage.setItem('fw_level', Math.min(40, currentLevel + 1));
            document.exitPointerLock();
            document.getElementById('win-modal').style.display = 'block';
        }

        function nextLevelAction() {
            document.getElementById('win-modal').style.display = 'none';
            if (currentLevel < 40) {
                currentLevel++;
                document.getElementById('hud-level').textContent = currentLevel;
                buildCaveLevel(currentLevel);
                respawnPlayer();
            } else {
                document.getElementById('menu').style.display = 'flex';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isDying) { renderer.render(scene, camera); return; }

            const time = Date.now() * 0.003;

            // حركة وحش المغارة المطارد
            if (monsterGroup && playerGroup) {
                monsterGroup.position.z -= monsterSpeed;
                monsterGroup.position.x += (playerGroup.position.x - monsterGroup.position.x) * 0.02;
                monsterGroup.position.y = playerGroup.position.y - 0.2;

                if (playerGroup.position.distanceTo(monsterGroup.position) < 2.2) {
                    showToast("👹 ألمحك الوحش وهاجمك!");
                    triggerDeathAnimation();
                }
            }

            // حركة اللاعب بدعم زوايا رؤية الكاميرا (First-Person Movements)
            targetVelocity.x = 0; targetVelocity.z = 0;
            let moveSpeed = baseSpeed;

            if (keys['arrowleft'] || keys['a']) targetVelocity.x = -moveSpeed;
            if (keys['arrowright'] || keys['d']) targetVelocity.x = moveSpeed;
            if (keys['arrowup'] || keys['w']) targetVelocity.z = -moveSpeed;
            if (keys['arrowdown'] || keys['s']) targetVelocity.z = moveSpeed;

            // تحويل الاتجاهات حسب زاوية النظر Yaw
            const cos = Math.cos(yaw);
            const sin = Math.sin(yaw);

            let vx = targetVelocity.x * cos - targetVelocity.z * sin;
            let vz = targetVelocity.x * sin + targetVelocity.z * cos;

            velocity.x += (vx - velocity.x) * 0.25;
            velocity.z += (vz - velocity.z) * 0.25;
            velocity.y -= gravity;

            // نظام التصادم الفيزيائي الممتاز المحسن (Box Collision Physics)
            let nextX = playerGroup.position.x + velocity.x;
            let nextY = playerGroup.position.y + velocity.y;
            let nextZ = playerGroup.position.z + velocity.z;

            isGrounded = false;

            for (let p of platforms) {
                const pX = p.pos.x;
                const pY = p.pos.y;
                const pZ = p.pos.z;

                const pHalfW = p.size.w / 2;
                const pHalfH = p.size.h / 2;
                const pHalfD = p.size.d / 2;

                const overlapX = (nextX + playerSize.w / 2 > pX - pHalfW) && (nextX - playerSize.w / 2 < pX + pHalfW);
                const overlapZ = (nextZ + playerSize.d / 2 > pZ - pHalfD) && (nextZ - playerSize.d / 2 < pZ + pHalfD);

                if (overlapX && overlapZ) {
                    const playerBottom = nextY;
                    const platformTop = pY + pHalfH;

                    if (velocity.y <= 0 && playerBottom <= platformTop + 0.3 && playerBottom >= platformTop - 0.6) {
                        nextY = platformTop;
                        velocity.y = 0;
                        isGrounded = true;
                        jumpsLeft = maxJumps;
                    }
                }
            }

            playerGroup.position.set(nextX, nextY, nextZ);

            // تثبيت الكاميرا عند مستوى عين الشخص الأول ومحاكات المشي (Head Bobbing)
            const headBob = isGrounded && (Math.abs(velocity.x) > 0.05 || Math.abs(velocity.z) > 0.05) ? Math.sin(time * 12) * 0.08 : 0;
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 1.5 + headBob, playerGroup.position.z);

            // تدوير رؤية الكاميرا
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.x = pitch; euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            if (playerGroup.position.y < -12) triggerDeathAnimation();

            // التحقق من الوصول لمنصة البوابة النهائية
            const finishObj = scene.getObjectByName("finish");
            if (finishObj) {
                const finishWorldPos = new THREE.Vector3();
                finishObj.getWorldPosition(finishWorldPos);
                if (playerGroup.position.distanceTo(finishWorldPos) < 2.5) {
                    openWinModal();
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initShopPreview;
    </script>
</body>
</html>
