<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باركور الألغاز والفخاخ 3D - 20 مستوى</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; overflow: hidden; background: #000; }
        
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 30px;
            border-radius: 16px; color: white; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid #3b82f6;
            z-index: 10; min-width: 320px;
        }

        #menu h1 { margin-top: 0; color: #60a5fa; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: white; font-size: 16px; outline: none;
        }

        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; padding: 12px 30px; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%;
        }

        #hud {
            position: absolute; top: 15px; right: 15px; left: 15px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 18px; font-weight: bold; z-index: 5;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.8); padding: 10px 20px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }

        #toast-msg {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            color: #4ade80; font-size: 26px; font-weight: bold; opacity: 0;
            transition: opacity 0.4s ease; pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>🎮 باركور الألغاز والفخاخ 3D</h1>
        <div class="form-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="player-name-input" value="البطل">
        </div>
        <div class="form-group">
            <label>لون الشخصية:</label>
            <input type="color" id="player-color-input" value="#00fff5">
        </div>
        <div class="form-group">
            <label>اختر المستوى (1 - 20):</label>
            <select id="level-select"></select>
        </div>
        <button onclick="startGame()">ابدأ التحدي 🚀</button>
    </div>

    <div id="hud">
        <div class="hud-card">اللاعب: <span id="hud-name" style="color: #60a5fa;">-</span></div>
        <div class="hud-card">المفتاح: <span id="hud-key" style="color: #ef4444;">❌ مفقود</span></div>
        <div class="hud-card">المستوى: <span id="hud-level" style="color: #facc15;">1</span> / 20</div>
    </div>
    <div id="toast-msg"></div>

    <script>
        const levelSelect = document.getElementById('level-select');
        for (let i = 1; i <= 20; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = `المستوى ${i}`;
            levelSelect.appendChild(opt);
        }

        let scene, camera, renderer;
        let playerGroup, playerMesh;
        let platforms = [], spikes = [], checkpoints = [], traps = [];
        let keyObject = null, doorObject = null;
        let hasKey = false;
        
        let currentLevel = 1;
        let activeCheckpoint = { x: 0, y: 3, z: 0 };
        let isGrounded = false;
        
        // فيزياء الباركور الدقيقة
        const gravity = 0.018;
        let velocity = { x: 0, y: 0, z: 0 };
        const speed = 0.15;
        const jumpForce = 0.36;
        const keys = {};

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.code === 'Space' && isGrounded) {
                    velocity.y = jumpForce;
                    isGrounded = false;
                }
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function createPlayer(colorHex) {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.3 });
            playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
            playerMesh.castShadow = true;
            playerGroup.add(playerMesh);

            const eyeGeo = new THREE.BoxGeometry(0.2, 0.3, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.3, 0.2, -0.61);
            const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.3, 0.2, -0.61);
            
            const pupilGeo = new THREE.BoxGeometry(0.1, 0.15, 0.11);
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const p1 = new THREE.Mesh(pupilGeo, pupilMat); p1.position.set(-0.3, 0.2, -0.62);
            const p2 = new THREE.Mesh(pupilGeo, pupilMat); p2.position.set(0.3, 0.2, -0.62);

            playerGroup.add(e1, e2, p1, p2);
            scene.add(playerGroup);
        }

        // --- بناء اللغز والفخاخ والمستويات ---
        function buildLevel(levelNum) {
            // تنظيف القوائم
            platforms.forEach(p => scene.remove(p.mesh || p));
            spikes.forEach(s => scene.remove(s));
            checkpoints.forEach(c => scene.remove(c.mesh));
            traps.forEach(t => scene.remove(t.mesh));
            if (keyObject) scene.remove(keyObject);
            if (doorObject) scene.remove(doorObject);

            platforms = []; spikes = []; checkpoints = []; traps = [];
            hasKey = false;
            updateKeyHUD();

            const length = 12 + levelNum * 6;
            let currentZ = 0, currentY = 0;

            // 1. منصة البداية
            createPlatform(0, 0, 0, 6, 1, 6, 0x334155);

            let keyPlaced = false;
            const keyTargetIndex = Math.floor(length * 0.4);

            for (let i = 0; i < length; i++) {
                const gap = 3.5 + Math.min(levelNum * 0.15, 2.5); // فجوات محسوبة وممكنة القفز
                currentZ -= (4.5 + gap);
                currentY += (Math.random() - 0.35) * 1.8;

                const pWidth = Math.max(2.2, 5.5 - levelNum * 0.12);
                const pLength = Math.max(2.5, 6 - levelNum * 0.12);
                const platX = (Math.sin(i * 0.8) * (2 + levelNum * 0.3));

                // أنواع المنصات: عادية، متحركة، أو تختفي عند اللمس (فخ)
                const isMoving = Math.random() < 0.25;
                const isFakeTrap = !isMoving && Math.random() < 0.15 + (levelNum * 0.01);

                const platColor = isFakeTrap ? 0x94a3b8 : (isMoving ? 0x0284c7 : 0x1e293b);
                const plat = createPlatform(platX, currentY, currentZ, pWidth, 1, pLength, platColor, isMoving, isFakeTrap);

                // أضف مفتاح اللغز في مسار جانبي/مرتفع
                if (i === keyTargetIndex && !keyPlaced) {
                    createKey(platX, currentY + 1.8, currentZ);
                    keyPlaced = true;
                }

                // إضافة فخاخ (كرة عملاقة تتحرك أو شفرة حمراء)
                if (i > 2 && Math.random() < 0.2 + (levelNum * 0.015)) {
                    createMovingTrap(platX, currentY + 1.2, currentZ, pWidth);
                }

                // أشواك ثابته
                if (!isFakeTrap && Math.random() < 0.3) {
                    createSpike(platX, currentY + 0.8, currentZ, pWidth);
                }

                // أسهم التشيك بوانت
                if (i > 0 && i % 7 === 0 && i < length - 2) {
                    createCheckpoint(platX, currentY + 0.5, currentZ);
                }
            }

            // 2. الباب المغلق (اللغز) ونهاية المستوى
            currentZ -= 8;
            createPlatform(0, currentY, currentZ, 8, 1, 8, 0x1e293b);
            
            // الباب الذي يفتح فقط بعد جمع المفتاح
            const doorGeo = new THREE.BoxGeometry(6, 4, 0.5);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3 });
            doorObject = new THREE.Mesh(doorGeo, doorMat);
            doorObject.position.set(0, currentY + 2.5, currentZ - 1);
            scene.add(doorObject);

            // خط النهاية خلف الباب
            const finishGeo = new THREE.BoxGeometry(6, 0.2, 3);
            const finishMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d });
            const finishLine = new THREE.Mesh(finishGeo, finishMat);
            finishLine.position.set(0, currentY + 0.6, currentZ - 3);
            scene.add(finishLine);
            finishLine.name = "finish";
        }

        function createPlatform(x, y, z, w, h, d, color, isMoving = false, isFake = false) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true; mesh.castShadow = true;
            scene.add(mesh);

            const platData = { mesh, isMoving, isFake, initialX: x, speed: 0.04, dir: 1, touched: false };
            platforms.push(platData);
            return mesh;
        }

        function createKey(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const ringGeo = new THREE.TorusGeometry(0.4, 0.1, 8, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, emissive: 0x713f12 });
            const ring = new THREE.Mesh(ringGeo, mat);
            group.add(ring);

            keyObject = group;
            scene.add(keyObject);
        }

        function createMovingTrap(x, y, z, width) {
            const geo = new THREE.SphereGeometry(0.6, 12, 12);
            const mat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x - width/2, y, z);
            scene.add(mesh);

            traps.push({ mesh, startX: x - width/2, endX: x + width/2, speed: 0.05, dir: 1 });
        }

        function createSpike(x, y, z, pWidth) {
            const geo = new THREE.ConeGeometry(0.4, 1, 6);
            const mat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
            const spike = new THREE.Mesh(geo, mat);
            spike.position.set(x + (Math.random() - 0.5) * (pWidth - 0.8), y, z);
            scene.add(spike);
            spikes.push(spike);
        }

        function createCheckpoint(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const coneGeo = new THREE.ConeGeometry(0.5, 0.9, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
            const cone = new THREE.Mesh(coneGeo, mat);
            cone.rotation.x = Math.PI; cone.position.y = 1;

            group.add(cone);
            scene.add(group);
            checkpoints.push({ mesh: group, pos: { x, y: y + 1.2, z }, activated: false });
        }

        function startGame() {
            const name = document.getElementById('player-name-input').value || "البطل";
            const color = document.getElementById('player-color-input').value;
            currentLevel = parseInt(document.getElementById('level-select').value);

            document.getElementById('hud-name').textContent = name;
            document.getElementById('hud-level').textContent = currentLevel;
            document.getElementById('menu').style.display = 'none';

            if (!scene) initScene();

            createPlayer(color);
            buildLevel(currentLevel);
            
            activeCheckpoint = { x: 0, y: 2, z: 0 };
            respawnPlayer();
            animate();
        }

        function respawnPlayer() {
            playerGroup.position.set(activeCheckpoint.x, activeCheckpoint.y, activeCheckpoint.z);
            velocity = { x: 0, y: 0, z: 0 };
        }

        function showToast(text, color = '#4ade80') {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text;
            msg.style.color = color;
            msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2000);
        }

        function updateKeyHUD() {
            const keyHud = document.getElementById('hud-key');
            if (hasKey) {
                keyHud.textContent = "🔑 تم الجمع";
                keyHud.style.color = "#4ade80";
            } else {
                keyHud.textContent = "❌ مفقود";
                keyHud.style.color = "#ef4444";
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // الحركة والتحكم
            if (keys['arrowleft'] || keys['a']) velocity.x = -speed;
            else if (keys['arrowright'] || keys['d']) velocity.x = speed;
            else velocity.x = 0;

            if (keys['arrowup'] || keys['w']) velocity.z = -speed;
            else if (keys['arrowdown'] || keys['s']) velocity.z = speed;
            else velocity.z = 0;

            velocity.y -= gravity;

            playerGroup.position.x += velocity.x;
            playerGroup.position.y += velocity.y;
            playerGroup.position.z += velocity.z;

            // 1. تحريك المنصات والفخاخ
            platforms.forEach(p => {
                if (p.isMoving) {
                    p.mesh.position.x += p.speed * p.dir;
                    if (Math.abs(p.mesh.position.x - p.initialX) > 3) p.dir *= -1;
                }
                // تحلل الفخاخ الوهمية عند اللمس
                if (p.isFake && p.touched) {
                    p.mesh.position.y -= 0.15; // تسقط الأرضية
                }
            });

            traps.forEach(t => {
                t.mesh.position.x += t.speed * t.dir;
                if (t.mesh.position.x > t.endX || t.mesh.position.x < t.startX) t.dir *= -1;
            });

            if (keyObject) keyObject.rotation.y += 0.04;

            // 2. تصادمات المنصات والقفز
            isGrounded = false;
            const playerBox = new THREE.Box3().setFromObject(playerGroup);

            for (let p of platforms) {
                const platBox = new THREE.Box3().setFromObject(p.mesh);
                if (playerBox.intersectsBox(platBox)) {
                    if (velocity.y < 0 && playerGroup.position.y >= p.mesh.position.y + 0.4) {
                        playerGroup.position.y = p.mesh.position.y + 1.1;
                        velocity.y = 0;
                        isGrounded = true;

                        if (p.isMoving) playerGroup.position.x += p.speed * p.dir;
                        if (p.isFake) p.touched = true; // تفعيل فخ الأرضية
                    }
                }
            }

            // 3. التقاط المفتاح
            if (keyObject && !hasKey) {
                const keyBox = new THREE.Box3().setFromObject(keyObject);
                if (playerBox.intersectsBox(keyBox)) {
                    hasKey = true;
                    scene.remove(keyObject);
                    updateKeyHUD();
                    showToast("🔑 جمعت المفتاح! افكك لغز الباب الآن");
                }
            }

            // 4. التصادم مع الباب
            if (doorObject) {
                const doorBox = new THREE.Box3().setFromObject(doorObject);
                if (playerBox.intersectsBox(doorBox)) {
                    if (hasKey) {
                        scene.remove(doorObject); // فتح الباب
                        doorObject = null;
                        showToast("🔓 انفتح الباب!");
                    } else {
                        // منع العبور وإرجاع اللاعب قليلاً
                        playerGroup.position.z += 0.2;
                        showToast("🔒 الباب مغلق! ابحث عن المفتاح أولاً", "#ef4444");
                    }
                }
            }

            // 5. التصادم مع الأشواك والفخاخ
            [...spikes, ...traps.map(t => t.mesh)].forEach(danger => {
                const dangerBox = new THREE.Box3().setFromObject(danger);
                if (playerBox.intersectsBox(dangerBox)) respawnPlayer();
            });

            // 6. التشيك بوانت
            checkpoints.forEach(cp => {
                const cpBox = new THREE.Box3().setFromObject(cp.mesh);
                if (playerBox.intersectsBox(cpBox) && !cp.activated) {
                    cp.activated = true;
                    activeCheckpoint = { ...cp.pos };
                    cp.mesh.children[0].material.color.setHex(0x22c55e);
                    showToast("🚩 تم حفظ نقطة التفتيش!");
                }
            });

            // السقوط
            if (playerGroup.position.y < -12) respawnPlayer();

            // 7. خط النهاية
            const finishObj = scene.getObjectByName("finish");
            if (finishObj) {
                const finishBox = new THREE.Box3().setFromObject(finishObj);
                if (playerBox.intersectsBox(finishBox)) {
                    if (currentLevel < 20) {
                        alert(`🎉 ممتاز! تجاوزت المستوى ${currentLevel}`);
                        currentLevel++;
                        document.getElementById('hud-level').textContent = currentLevel;
                        buildLevel(currentLevel);
                        activeCheckpoint = { x: 0, y: 2, z: 0 };
                        respawnPlayer();
                    } else {
                        alert('🏆 أسطورة! أكملت جميع الألغاز والمستويات الـ 20!');
                        document.getElementById('menu').style.display = 'block';
                    }
                }
            }

            // كاميرا سلسة
            camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1;
            camera.position.y += (playerGroup.position.y + 4 - camera.position.y) * 0.1;
            camera.position.z += (playerGroup.position.z + 7 - camera.position.z) * 0.1;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z - 2);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
