<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باركور العالم المفتوح والوحش - Roblox 4D</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; overflow: hidden; background: #000; user-select: none; }
        
        /* القائمة الرئيسية */
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 30px;
            border-radius: 20px; color: white; text-align: center;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.6); border: 2px solid #3b82f6;
            z-index: 10; min-width: 340px; backdrop-filter: blur(8px);
        }

        #menu h1 { margin-top: 0; color: #60a5fa; text-shadow: 0 0 10px #60a5fa; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: white; font-size: 16px; outline: none;
        }

        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; padding: 12px 30px; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%;
            box-shadow: 0 4px 15px rgba(37,99,235,0.4);
        }
        button:hover { transform: scale(1.02); }

        /* شاشة HUD */
        #hud {
            position: absolute; top: 15px; right: 15px; left: 15px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 16px; font-weight: bold; z-index: 5;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.75); padding: 10px 18px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 8px;
        }

        /* نافذة التهنئة والانتقال */
        #win-modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 35px;
            border-radius: 20px; color: white; text-align: center;
            border: 3px solid #22c55e; box-shadow: 0 0 40px rgba(34, 197, 94, 0.6);
            z-index: 20; min-width: 320px;
        }
        #win-modal h2 { color: #4ade80; margin-top: 0; font-size: 28px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-next { background: #22c55e; }
        .btn-stay { background: #64748b; }

        #toast-msg {
            position: absolute; top: 18%; left: 50%; transform: translate(-50%, -50%);
            color: #4ade80; font-size: 22px; font-weight: bold; opacity: 0;
            transition: opacity 0.4s ease; pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.9); padding: 12px 28px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2); z-index: 6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>🎮 باركور روبلوكس المطور 4D</h1>
        <div class="form-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="player-name-input" value="البطل">
        </div>
        <div class="form-group">
            <label>لون قميص الشخصية:</label>
            <input type="color" id="player-color-input" value="#2563eb">
        </div>
        <div class="form-group">
            <label>اختر المستوى (1 - 20):</label>
            <select id="level-select"></select>
        </div>
        <button onclick="startGame()">ابدأ اللعب الآن 🚀</button>
    </div>

    <div id="hud">
        <div class="hud-card">👤 <span id="hud-name" style="color: #60a5fa;">-</span></div>
        <div class="hud-card">⚡ <span id="hud-ability" style="color: #38bdf8;">عادية</span></div>
        <div class="hud-card">💀 <span id="hud-deaths" style="color: #ef4444;">0</span></div>
        <div class="hud-card">🔑 <span id="hud-key" style="color: #ef4444;">❌ مفقود</span></div>
        <div class="hud-card">📍 <span id="hud-level" style="color: #facc15;">1</span> / 20</div>
    </div>

    <div id="win-modal">
        <h2 id="win-title">🎉 أحسنت! تجاوزت المرحلة!</h2>
        <p id="win-desc">هل تريد المرور إلى المرحلة التالية أم البقاء لاستكشاف المكان؟</p>
        <div class="modal-btns">
            <button class="btn-next" onclick="nextLevelAction()">المرحلة التالية ⏩</button>
            <button class="btn-stay" onclick="closeWinModal()">البقاء هنا 🔍</button>
        </div>
    </div>

    <div id="toast-msg"></div>

    <script>
        const levelSelect = document.getElementById('level-select');
        for (let i = 1; i <= 20; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = `المستوى ${i}`;
            levelSelect.appendChild(opt);
        }

        let scene, camera, renderer;
        let playerGroup, playerTorso, playerHead, leftArm, rightArm, leftLeg, rightLeg;
        let monsterGroup = null;
        let deathParticles = [];
        let platforms = [], spikes = [], checkpoints = [], traps = [], bgStars;
        let keyObject = null, doorObject = null, portalObject = null;
        let hasKey = false, deathCount = 0;
        let isDying = false, isDancing = false;
        
        let currentLevel = 1;
        let activeCheckpoint = { x: 0, y: 3, z: 0 };
        let isGrounded = false;

        let hasDoubleJumpPower = false;
        let jumpsLeft = 1;

        // فيزياء الحركة المريحة
        const gravity = 0.010;
        let velocity = { x: 0, y: 0, z: 0 };
        let currentSpeed = 0.18;
        let jumpForce = 0.35;
        const keys = {};

        let time4D = 0;

        // الأصوات
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'death') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.2);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.004);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            dirLight.position.set(40, 80, 40);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createRealisticEnvironment();

            window.addEventListener('keydown', e => {
                initAudio();
                keys[e.key.toLowerCase()] = true;
                if (e.code === 'Space' && !isDying && !isDancing) {
                    if (isGrounded) {
                        velocity.y = jumpForce;
                        isGrounded = false;
                        jumpsLeft = hasDoubleJumpPower ? 1 : 0;
                        playSound('jump');
                    } else if (hasDoubleJumpPower && jumpsLeft > 0) {
                        velocity.y = jumpForce * 0.95;
                        jumpsLeft--;
                        playSound('jump');
                        showToast("✨ قفزة مزدوجة!");
                    }
                }
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', onWindowResize);
        }

        // تحسين واقعية البيئة والمجرات
        function createRealisticEnvironment() {
            const starsGeo = new THREE.BufferGeometry();
            const count = 3500;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 900;
                positions[i+1] = (Math.random() - 0.5) * 900;
                positions[i+2] = (Math.random() - 0.5) * 900;

                colors[i] = 0.5 + Math.random() * 0.5;
                colors[i+1] = 0.7 + Math.random() * 0.3;
                colors[i+2] = 1.0;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const starsMat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.8 });
            bgStars = new THREE.Points(starsGeo, starsMat);
            scene.add(bgStars);
        }

        // --- مجسم روبلوكس الواقعي مع الشعر التفصيلي ---
        function createDetailedRobloxPlayer(colorHex) {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            const shirtMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.4 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.3 }); // شعر بني داكن

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            playerHead = new THREE.Mesh(headGeo, skinMat); playerHead.position.y = 1.5;

            // شعر مجسم ثلاثي الأبعاد فوق الرأس
            const hairTop = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.25, 0.86), hairMat);
            hairTop.position.set(0, 1.95, 0);
            
            const hairBack = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.5, 0.2), hairMat);
            hairBack.position.set(0, 1.65, 0.35);

            const hairBangs = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.2, 0.2), hairMat);
            hairBangs.position.set(0, 1.82, -0.38);

            // العيون والفم
            const eyeGeo = new THREE.BoxGeometry(0.12, 0.15, 0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.2, 1.55, -0.41);
            const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.2, 1.55, -0.41);

            // الجذع واليدين والأرجل
            const torsoGeo = new THREE.BoxGeometry(1.0, 1.0, 0.5);
            playerTorso = new THREE.Mesh(torsoGeo, shirtMat); playerTorso.position.y = 0.6;

            const armGeo = new THREE.BoxGeometry(0.4, 0.9, 0.4);
            leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.7, 0.65, 0);
            rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.7, 0.65, 0);

            const legGeo = new THREE.BoxGeometry(0.45, 0.9, 0.45);
            leftLeg = new THREE.Mesh(legGeo, pantsMat); leftLeg.position.set(-0.25, -0.3, 0);
            rightLeg = new THREE.Mesh(legGeo, pantsMat); rightLeg.position.set(0.25, -0.3, 0);

            playerGroup.add(playerHead, hairTop, hairBack, hairBangs, e1, e2, playerTorso, leftArm, rightArm, leftLeg, rightLeg);
            scene.add(playerGroup);
        }

        // --- إنشاء الوحش المطارد (البعيد) ---
        function createMonster(x, y, z) {
            if (monsterGroup) scene.remove(monsterGroup);
            monsterGroup = new THREE.Group();

            const mat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.1, emissive: 0x78350f });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 1.5), mat);
            body.position.y = 1.5;

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), mat);
            head.position.y = 3.5;

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.1), eyeMat);
            eye1.position.set(-0.4, 3.7, -0.76);
            const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.1), eyeMat);
            eye2.position.set(0.4, 3.7, -0.76);

            monsterGroup.add(body, head, eye1, eye2);
            monsterGroup.position.set(x, y, z);
            scene.add(monsterGroup);
        }

        // --- بناء المستويات (تسهيل المراحل 11-20 وإضافة البوابة والوحش) ---
        function buildLevel(levelNum) {
            platforms.forEach(p => scene.remove(p.mesh));
            spikes.forEach(s => scene.remove(s));
            checkpoints.forEach(c => scene.remove(c.mesh));
            traps.forEach(t => scene.remove(t.mesh));
            if (keyObject) scene.remove(keyObject);
            if (doorObject) scene.remove(doorObject);
            if (portalObject) scene.remove(portalObject);
            if (monsterGroup) scene.remove(monsterGroup);

            platforms = []; spikes = []; checkpoints = []; traps = []; monsterGroup = null;
            hasKey = false; isDancing = false; updateKeyHUD();

            const isHarderHalf = levelNum >= 11;
            const length = isHarderHalf ? 15 : (18 + levelNum * 2); // المراحل الأخيرة أقصر وأسهل
            let currentZ = 0, currentY = 0, currentX = 0;

            createPlatform(0, 0, 0, 14, 1, 14, 0x334155); // منصة بداية واسعة

            if (isHarderHalf) {
                // المراحل 11 إلى 20: بوابة تنقلك لعالم سري فيه الوحش والمفتاح!
                const portalX = 0, portalY = 2, portalZ = -15;
                createPlatform(0, 0, -15, 10, 1, 10, 0x0284c7);

                const portalGeo = new THREE.TorusGeometry(2, 0.3, 16, 32);
                const portalMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0x9333ea });
                portalObject = new THREE.Mesh(portalGeo, portalMat);
                portalObject.position.set(portalX, portalY + 1, portalZ);
                scene.add(portalObject);

                // عالم المفتاح الفرعي والوحش المطارد
                const subX = 60, subY = 10, subZ = -40;
                createPlatform(subX, subY, subZ, 12, 1, 12, 0x9333ea); // منصة الوصول
                createPlatform(subX, subY, subZ - 12, 8, 1, 8, 0x1e293b);
                createKey(subX, subY + 2, subZ - 12);

                // إنشاء الوحش يطارد في هذا العالم السري
                createMonster(subX, subY, subZ - 25);
            } else {
                // المراحل 1 إلى 10
                createKey(15, 6, -Math.floor(length * 2.5));
                createPlatform(15, 4, -Math.floor(length * 2.5), 6, 1, 6, 0x9333ea);
                for(let k=1; k<=3; k++) {
                    createPlatform(15 * (k/3), 4 * (k/3), -Math.floor(length * 2.5) * (k/3), 6, 0.8, 6, 0x06b6d4);
                }
            }

            // المسار الرئيسي
            for (let i = 0; i < length; i++) {
                const gap = isHarderHalf ? 2.0 : 2.5; // الفجوات أسهل وأقرب جداً في المراحل 11-20
                currentZ -= (5 + gap);
                currentY += 0.3;
                currentX += (Math.sin(i * 0.4) * 4);

                const pWidth = isHarderHalf ? 8 : Math.max(5, 8 - levelNum * 0.03); // منصات واسعة جداً
                const pLength = isHarderHalf ? 8 : Math.max(5, 8 - levelNum * 0.03);

                const isMoving = Math.random() < 0.15;
                const isFakeTrap = !isMoving && Math.random() < 0.1;

                const platColor = isFakeTrap ? 0xf59e0b : (isMoving ? 0x0284c7 : 0x1e293b);
                createPlatform(currentX, currentY, currentZ, pWidth, 1, pLength, platColor, isMoving, isFakeTrap);

                if (i > 0 && i % 4 === 0) {
                    createCheckpoint(currentX, currentY + 0.5, currentZ);
                }
            }

            // النهاية والباب
            currentZ -= 10;
            createPlatform(currentX, currentY, currentZ, 12, 1, 12, 0x1e293b);
            
            const doorGeo = new THREE.BoxGeometry(8, 5, 0.6);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2 });
            doorObject = new THREE.Mesh(doorGeo, doorMat);
            doorObject.position.set(currentX, currentY + 3, currentZ - 2);
            scene.add(doorObject);

            const finishGeo = new THREE.BoxGeometry(8, 0.2, 4);
            const finishMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d });
            const finishLine = new THREE.Mesh(finishGeo, finishMat);
            finishLine.position.set(currentX, currentY + 0.6, currentZ - 5);
            scene.add(finishLine);
            finishLine.name = "finish";
        }

        function createPlatform(x, y, z, w, h, d, color, isMoving = false, isFake = false) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true; mesh.castShadow = true;
            scene.add(mesh);

            platforms.push({ mesh, isMoving, isFake, initialX: x, speed: 0.03, dir: 1, standTimer: null, falling: false });
            return mesh;
        }

        function createKey(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const ringGeo = new THREE.TorusGeometry(0.5, 0.12, 8, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, emissive: 0x854d0e });
            const ring = new THREE.Mesh(ringGeo, mat);
            group.add(ring);

            keyObject = group;
            scene.add(keyObject);
        }

        function createCheckpoint(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const coneGeo = new THREE.ConeGeometry(0.6, 1.0, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
            const cone = new THREE.Mesh(coneGeo, mat);
            cone.rotation.x = Math.PI; cone.position.y = 1.2;

            group.add(cone);
            scene.add(group);
            checkpoints.push({ mesh: group, pos: { x, y: y + 1.2, z }, activated: false });
        }

        function startGame() {
            initAudio();
            const name = document.getElementById('player-name-input').value || "البطل";
            const color = document.getElementById('player-color-input').value;
            currentLevel = parseInt(document.getElementById('level-select').value);

            document.getElementById('hud-name').textContent = name;
            document.getElementById('hud-level').textContent = currentLevel;
            document.getElementById('menu').style.display = 'none';

            if (!scene) initScene();

            createDetailedRobloxPlayer(color);
            buildLevel(currentLevel);
            
            activeCheckpoint = { x: 0, y: 3, z: 0 };
            respawnPlayer();
            animate();
        }

        // --- إعادة التجديد وعملية تجدد العالم عند الموت ---
        function triggerDeathAnimation() {
            if (isDying) return;
            isDying = true;
            playSound('death');
            deathCount++;
            document.getElementById('hud-deaths').textContent = deathCount;

            playerGroup.visible = false;

            deathParticles = [];
            const partGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const partMat = new THREE.MeshStandardMaterial({ color: document.getElementById('player-color-input').value });

            for (let i = 0; i < 20; i++) {
                const p = new THREE.Mesh(partGeo, partMat);
                p.position.copy(playerGroup.position);
                p.position.y += Math.random() * 1.5;

                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    Math.random() * 0.3 + 0.1,
                    (Math.random() - 0.5) * 0.3
                );
                scene.add(p);
                deathParticles.push({ mesh: p, vel });
            }

            setTimeout(() => {
                deathParticles.forEach(dp => scene.remove(dp.mesh));
                deathParticles = [];
                isDying = false;
                playerGroup.visible = true;

                // تجدد وتغيير العالم عشوائياً عند كل موت!
                showToast("🔄 يتجدد العالم الآن بالفخاخ!", "#38bdf8");
                buildLevel(currentLevel);
                respawnPlayer();
            }, 1000);
        }

        function respawnPlayer() {
            playerGroup.position.set(activeCheckpoint.x, activeCheckpoint.y, activeCheckpoint.z);
            velocity = { x: 0, y: 0, z: 0 };
            playerGroup.rotation.y = 0;
        }

        function showToast(text, color = '#4ade80') {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text;
            msg.style.color = color;
            msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2500);
        }

        function updateKeyHUD() {
            const keyHud = document.getElementById('hud-key');
            if (hasKey) {
                keyHud.textContent = "🔑 تم الجمع"; keyHud.style.color = "#4ade80";
            } else {
                keyHud.textContent = "❌ مفقود"; keyHud.style.color = "#ef4444";
            }
        }

        function triggerConfetti() {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }

        function openWinModal() {
            isDancing = true; // تفعيل رقص الفوز
            playSound('win');
            triggerConfetti();
            
            const modal = document.getElementById('win-modal');
            const title = document.getElementById('win-title');
            const desc = document.getElementById('win-desc');

            if (currentLevel === 20) {
                title.textContent = "🏆 بطل الألعاب 4D! ختمت كل المستويات!";
                desc.textContent = "تهانينا العظيمة! أكملت جميع التحديات والمستويات العشرين بنجاح خيالي!";
            } else {
                title.textContent = `🎉 أحسنت! تجاوزت المرحلة ${currentLevel}`;
                desc.textContent = "هل تريد المرور للمرحلة القادمة أم استكشاف الخفايا؟";
            }
            modal.style.display = 'block';
        }

        function closeWinModal() {
            document.getElementById('win-modal').style.display = 'none';
            isDancing = false;
        }

        function nextLevelAction() {
            closeWinModal();
            if (currentLevel < 20) {
                currentLevel++;
                document.getElementById('hud-level').textContent = currentLevel;
                buildLevel(currentLevel);
                activeCheckpoint = { x: 0, y: 3, z: 0 };
                respawnPlayer();
            } else {
                document.getElementById('menu').style.display = 'block';
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            time4D += 0.01;
            if (bgStars) {
                bgStars.rotation.y += 0.0005;
                bgStars.rotation.x = Math.sin(time4D * 0.2) * 0.1;
            }

            // حركة الوحش المطارد نحو اللاعب
            if (monsterGroup) {
                monsterGroup.lookAt(playerGroup.position.x, monsterGroup.position.y, playerGroup.position.z);
                monsterGroup.position.z += 0.025; // يتحرك الوحش ببطء نحو اللاعب
                
                const monsterBox = new THREE.Box3().setFromObject(monsterGroup);
                const playerBoxMat = new THREE.Box3().setFromObject(playerGroup);
                if (monsterBox.intersectsBox(playerBoxMat)) triggerDeathAnimation();
            }

            if (isDying) {
                deathParticles.forEach(dp => {
                    dp.mesh.position.add(dp.vel);
                    dp.vel.y -= 0.01;
                    dp.mesh.rotation.x += 0.1;
                });
                renderer.render(scene, camera);
                return;
            }

            // --- أنيميشن رقص الشخصية عند الفوز ---
            if (isDancing) {
                playerGroup.position.y = activeCheckpoint.y + Math.abs(Math.sin(time4D * 10)) * 0.8;
                playerGroup.rotation.y += 0.08;
                leftArm.rotation.z = Math.sin(time4D * 12) * 1.2;
                rightArm.rotation.z = -Math.sin(time4D * 12) * 1.2;
                leftLeg.rotation.x = Math.sin(time4D * 10) * 0.5;
                rightLeg.rotation.x = -Math.sin(time4D * 10) * 0.5;

                renderer.render(scene, camera);
                return;
            }

            // حركة وتوجيه
            let isMovingKey = false;
            let targetRotation = playerGroup.rotation.y;

            if (keys['arrowleft'] || keys['a']) { 
                velocity.x = -currentSpeed; isMovingKey = true; targetRotation = Math.PI / 2;
            }
            else if (keys['arrowright'] || keys['d']) { 
                velocity.x = currentSpeed; isMovingKey = true; targetRotation = -Math.PI / 2;
            }
            else velocity.x = 0;

            if (keys['arrowup'] || keys['w']) { 
                velocity.z = -currentSpeed; isMovingKey = true; 
                if (keys['arrowleft'] || keys['a']) targetRotation = Math.PI / 4;
                else if (keys['arrowright'] || keys['d']) targetRotation = -Math.PI / 4;
                else targetRotation = 0;
            }
            else if (keys['arrowdown'] || keys['s']) { 
                velocity.z = currentSpeed; isMovingKey = true; targetRotation = Math.PI;
            }
            else velocity.z = 0;

            playerGroup.rotation.y += (targetRotation - playerGroup.rotation.y) * 0.2;

            velocity.y -= gravity;

            playerGroup.position.x += velocity.x;
            playerGroup.position.y += velocity.y;
            playerGroup.position.z += velocity.z;

            // --- أنيميشن القفز والسقوط والمشي ---
            if (!isGrounded) {
                if (velocity.y > 0) {
                    // القفز: رفع الأيدي وثني الأرجل
                    leftArm.rotation.x = Math.PI * 0.8;
                    rightArm.rotation.x = Math.PI * 0.8;
                    leftLeg.rotation.x = -0.4; rightLeg.rotation.x = 0.4;
                } else {
                    // السقوط: مد الأذرع والأرجل كالمظلي
                    leftArm.rotation.z = 0.8; rightArm.rotation.z = -0.8;
                    leftLeg.rotation.z = -0.3; rightLeg.rotation.z = 0.3;
                }
            } else if (isMovingKey) {
                leftArm.rotation.z = 0; rightArm.rotation.z = 0;
                leftArm.rotation.x = Math.sin(time4D * 12) * 0.7;
                rightArm.rotation.x = -Math.sin(time4D * 12) * 0.7;
                leftLeg.rotation.x = -Math.sin(time4D * 12) * 0.7;
                rightLeg.rotation.x = Math.sin(time4D * 12) * 0.7;
            } else {
                leftArm.rotation.set(0,0,0); rightArm.rotation.set(0,0,0);
                leftLeg.rotation.set(0,0,0); rightLeg.rotation.set(0,0,0);
            }

            // تحديث المنصات والباب والبوابة
            platforms.forEach(p => {
                if (p.isMoving) {
                    p.mesh.position.x += p.speed * p.dir;
                    if (Math.abs(p.mesh.position.x - p.initialX) > 3) p.dir *= -1;
                }
                if (p.falling) p.mesh.position.y -= 0.15;
            });

            if (portalObject) portalObject.rotation.z += 0.03;
            if (keyObject) keyObject.rotation.y += 0.04;

            // تصادم الأرضيات
            isGrounded = false;
            const playerBox = new THREE.Box3().setFromObject(playerGroup);

            for (let p of platforms) {
                const platBox = new THREE.Box3().setFromObject(p.mesh);
                if (playerBox.intersectsBox(platBox)) {
                    if (velocity.y < 0 && playerGroup.position.y >= p.mesh.position.y + 0.3) {
                        playerGroup.position.y = p.mesh.position.y + 1.1;
                        velocity.y = 0;
                        isGrounded = true;
                        jumpsLeft = hasDoubleJumpPower ? 1 : 0;

                        if (p.isMoving) playerGroup.position.x += p.speed * p.dir;

                        if (p.isFake && !p.standTimer) {
                            p.mesh.material.color.setHex(0xef4444);
                            p.standTimer = setTimeout(() => { p.falling = true; }, 3000);
                        }
                    }
                }
            }

            // البوابة الفضائية (المراحل 11-20)
            if (portalObject) {
                const portalBox = new THREE.Box3().setFromObject(portalObject);
                if (playerBox.intersectsBox(portalBox)) {
                    playerGroup.position.set(60, 12, -40); // الانتقال الفوري للبعد السري!
                    showToast("🌀 انتقلت عبر البوابة للبعد السري! أحضر المفتاح وحاذر الوحش!");
                }
            }

            // المفتاح
            if (keyObject && !hasKey) {
                const keyBox = new THREE.Box3().setFromObject(keyObject);
                if (playerBox.intersectsBox(keyBox)) {
                    hasKey = true;
                    scene.remove(keyObject);
                    updateKeyHUD();
                    playSound('win');
                    showToast("🔑 جمعت المفتاح!");
                }
            }

            // الباب
            if (doorObject) {
                const doorBox = new THREE.Box3().setFromObject(doorObject);
                if (playerBox.intersectsBox(doorBox)) {
                    if (hasKey) {
                        scene.remove(doorObject);
                        doorObject = null;
                        showToast("🔓 انفتح الباب المغلق!");
                    } else {
                        playerGroup.position.z += 0.2;
                        showToast("🔒 الباب مغلق! اعبر البوابة واجلب المفتاح", "#ef4444");
                    }
                }
            }

            // لمس الفخاخ أو السقوط
            [...spikes, ...traps.map(t => t.mesh)].forEach(danger => {
                const dangerBox = new THREE.Box3().setFromObject(danger);
                if (playerBox.intersectsBox(dangerBox)) triggerDeathAnimation();
            });

            checkpoints.forEach(cp => {
                const cpBox = new THREE.Box3().setFromObject(cp.mesh);
                if (playerBox.intersectsBox(cpBox) && !cp.activated) {
                    cp.activated = true;
                    activeCheckpoint = { ...cp.pos };
                    cp.mesh.children[0].material.color.setHex(0x22c55e);
                    showToast("🚩 تم الحفظ بنجاح!");
                }
            });

            if (playerGroup.position.y < -20) triggerDeathAnimation();

            // خط النهاية
            const finishObj = scene.getObjectByName("finish");
            if (finishObj) {
                const finishBox = new THREE.Box3().setFromObject(finishObj);
                if (playerBox.intersectsBox(finishBox)) {
                    openWinModal();
                    playerGroup.position.z += 2;
                }
            }

            // متابعة الكاميرا
            camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1;
            camera.position.y += (playerGroup.position.y + 5 - camera.position.y) * 0.1;
            camera.position.z += (playerGroup.position.z + 10 - camera.position.z) * 0.1;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z - 2);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
