<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>روبلوكس 4D - نسخة الباركور الاحترافية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; overflow: hidden; background: #020617; user-select: none; touch-action: none; }
        
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 20px;
            border-radius: 20px; color: #f8fafc; text-align: center;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
            border: 2px solid rgba(56, 189, 248, 0.5);
            z-index: 10; width: 92%; max-width: 420px; max-height: 90vh; overflow-y: auto;
            backdrop-filter: blur(12px);
        }

        #menu h1 { margin-top: 0; color: #38bdf8; text-shadow: 0 0 10px #0284c7; font-size: 20px; }
        .form-group { margin-bottom: 10px; text-align: right; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: 600; color: #94a3b8; font-size: 12px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; font-size: 13px; outline: none;
        }

        .color-row { display: flex; gap: 8px; }
        .color-row div { flex: 1; }

        button.btn-main {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white; border: none; padding: 12px; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); margin-top: 10px;
        }

        #hud {
            position: absolute; top: 10px; right: 10px; left: 10px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 11px; font-weight: bold; z-index: 5; flex-wrap: wrap; gap: 6px;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); padding: 5px 10px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px;
        }

        #action-btn-container {
            position: absolute; bottom: 15px; left: 15px; z-index: 6;
            display: flex; gap: 6px; flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8;
            color: white; padding: 8px 12px; border-radius: 10px;
            font-size: 12px; font-weight: bold; cursor: pointer;
        }

        #touch-controls {
            display: none; position: absolute; bottom: 20px; right: 20px; z-index: 6;
            gap: 10px; flex-direction: column;
        }
        .touch-btn {
            width: 55px; height: 55px; border-radius: 50%; background: rgba(56, 189, 248, 0.4);
            border: 2px solid #38bdf8; color: white; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }

        #win-modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 25px;
            border-radius: 20px; color: white; text-align: center;
            border: 2px solid #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            z-index: 20; width: 85%; max-width: 320px;
        }

        #toast-msg {
            position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%);
            color: #4ade80; font-size: 13px; font-weight: bold; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none;
            background: rgba(15, 23, 42, 0.95); padding: 8px 16px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); z-index: 6; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>⚡ تحدي الباركور الاحترافي</h1>
        <div class="form-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="player-name-input" value="الباركور">
        </div>
        
        <div class="color-row">
            <div class="form-group">
                <label>لون القميص:</label>
                <input type="color" id="shirt-color-input" value="#0284c7">
            </div>
            <div class="form-group">
                <label>لون السروال:</label>
                <input type="color" id="pants-color-input" value="#0f172a">
            </div>
        </div>

        <div class="color-row">
            <div class="form-group">
                <label>لون الشعر:</label>
                <input type="color" id="hair-color-input" value="#f59e0b">
            </div>
            <div class="form-group">
                <label>لون العيون:</label>
                <input type="color" id="eye-color-input" value="#22c55e">
            </div>
        </div>

        <div class="form-group">
            <label>قصة الشعر:</label>
            <select id="hair-style-select">
                <option value="spiky">شوكية (Spiky Parkour)</option>
                <option value="short">قصير عادي</option>
                <option value="cap">قبعة رياضية</option>
            </select>
        </div>

        <div class="form-group">
            <label>المستوى (1 - 30):</label>
            <select id="level-select"></select>
        </div>

        <button class="btn-main" onclick="startGame()">انطلق للباركور 🚀</button>
    </div>

    <div id="hud">
        <div class="hud-card">👤 <span id="hud-name" style="color: #60a5fa;">-</span></div>
        <div class="hud-card">💰 <span id="hud-coins" style="color: #facc15;">0</span></div>
        <div class="hud-card">🔑 <span id="hud-key1" style="color: #ef4444;">❌</span></div>
        <div class="hud-card">💀 <span id="hud-deaths" style="color: #ef4444;">0</span></div>
        <div class="hud-card">📍 مرحلة: <span id="hud-level" style="color: #facc15;">1</span> / 30</div>
    </div>

    <div id="action-btn-container">
        <button class="action-btn" onclick="triggerDash()">⚡ اندفاع (Shift)</button>
    </div>

    <div id="touch-controls">
        <div class="touch-btn" onclick="simulateJump()">⬆️</div>
    </div>

    <div id="win-modal">
        <h2>🏆 أنجزت المسار بنجاح!</h2>
        <p>مبروك إتمام تحدي الباركور الصعب!</p>
        <button class="btn-main" onclick="nextLevelAction()">المرحلة التالية ⏩</button>
    </div>

    <div id="toast-msg"></div>

    <script>
        let savedLevel = parseInt(localStorage.getItem('r4d_level')) || 1;
        let savedCoins = parseInt(localStorage.getItem('r4d_coins')) || 0;

        const levelSelect = document.getElementById('level-select');
        for (let i = 1; i <= 30; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = `المستوى ${i}`;
            if (i === savedLevel) opt.selected = true;
            levelSelect.appendChild(opt);
        }

        let scene, camera, renderer;
        let playerGroup, leftArm, rightArm, leftLeg, rightLeg, headMesh, torsoMesh;
        let portalRingMesh = null;
        let platforms = [], traps = [], coinsArr = [], particlesArr = [];
        let key1Obj = null, roomDoorObj = null;
        
        let hasKey1 = false, deathCount = 0, coinsCount = savedCoins;
        let isDying = false;
        
        let currentLevel = savedLevel;
        let isGrounded = false, isOnIce = false;
        let jumpsLeft = 2; const maxJumps = 2;
        let canDash = true, isDashing = false;

        let audioCtx = null;
        let animTime = 0;
        const gravity = 0.014;
        let velocity = { x: 0, y: 0, z: 0 };
        let targetVelocity = { x: 0, z: 0 };
        let baseSpeed = 0.24;
        let jumpForce = 0.38;
        const keys = {};

        // محرك المؤثرات الصوتية البرمجية دون الحاجة لملفات خارجية
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.01);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            createStarfield();

            if ('ontouchstart' in window) {
                document.getElementById('touch-controls').style.display = 'flex';
            }

            window.addEventListener('keydown', e => {
                initAudio();
                const key = e.key.toLowerCase();
                keys[key] = true;
                if (e.code === 'ShiftLeft' || key === 'shift') triggerDash();
                if (e.code === 'Space' && !isDying) simulateJump();
            });

            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const count = 400;
            const posArray = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 250;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.8, color: 0x38bdf8 });
            const starMesh = new THREE.Points(starGeo, starMat);
            scene.add(starMesh);
        }

        function simulateJump() {
            if (isGrounded) {
                velocity.y = jumpForce; isGrounded = false; jumpsLeft = maxJumps - 1;
                playSound(320, 'square', 0.15);
                spawnDustParticles(playerGroup.position.x, playerGroup.position.y - 0.7, playerGroup.position.z);
            } else if (jumpsLeft > 0) {
                velocity.y = jumpForce * 0.9; jumpsLeft--;
                playSound(450, 'triangle', 0.2);
                showToast("✨ قفزة مزدوجة!");
            }
        }

        function createCustomPlayer() {
            if (playerGroup) scene.remove(playerGroup);
            playerGroup = new THREE.Group();

            const shirtColor = document.getElementById('shirt-color-input').value;
            const pantsColor = document.getElementById('pants-color-input').value;
            const hairColor = document.getElementById('hair-color-input').value;
            const eyeColor = document.getElementById('eye-color-input').value;
            const hairStyle = document.getElementById('hair-style-select').value;

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.4 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.5 });
            const hairMat = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.7 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: eyeColor });

            headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
            headMesh.position.y = 1.5; headMesh.castShadow = true;

            const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), eyeMat); eye1.position.set(-0.2, 1.55, -0.41);
            const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), eyeMat); eye2.position.set(0.2, 1.55, -0.41);

            let hairMesh;
            if (hairStyle === 'spiky') {
                hairMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.5, 5), hairMat);
                hairMesh.position.set(0, 2.1, 0);
            } else if (hairStyle === 'cap') {
                hairMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 1.1), hairMat);
                hairMesh.position.set(0, 1.95, -0.1);
            } else {
                hairMesh = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.25, 0.86), hairMat);
                hairMesh.position.set(0, 1.95, 0);
            }

            torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.0, 0.5), shirtMat); 
            torsoMesh.position.y = 0.6; torsoMesh.castShadow = true;

            leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.9, 0.32), skinMat); 
            leftArm.geometry.translate(0, -0.35, 0); leftArm.position.set(-0.62, 1.0, 0); leftArm.castShadow = true;

            rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.9, 0.32), skinMat); 
            rightArm.geometry.translate(0, -0.35, 0); rightArm.position.set(0.62, 1.0, 0); rightArm.castShadow = true;

            leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), pantsMat); 
            leftLeg.geometry.translate(0, -0.35, 0); leftLeg.position.set(-0.22, 0.1, 0); leftLeg.castShadow = true;

            rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), pantsMat); 
            rightLeg.geometry.translate(0, -0.35, 0); rightLeg.position.set(0.22, 0.1, 0); rightLeg.castShadow = true;

            playerGroup.add(headMesh, eye1, eye2, hairMesh, torsoMesh, leftArm, rightArm, leftLeg, rightLeg);
            scene.add(playerGroup);
        }

        function updatePlayerAnimations() {
            if (!playerGroup || isDying) return;

            const speed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
            
            if (!isGrounded) {
                // أنيميشن قفز الباركور الديناميكي
                leftArm.rotation.x = -Math.PI * 0.85;
                rightArm.rotation.x = -Math.PI * 0.85;
                leftLeg.rotation.x = Math.PI * 0.25;
                rightLeg.rotation.x = -Math.PI * 0.25;
                torsoMesh.rotation.x = 0.15;
            } else if (speed > 0.03) {
                animTime += speed * 2.8;
                const armAngle = Math.sin(animTime) * 0.8;
                const legAngle = Math.cos(animTime) * 0.8;

                leftArm.rotation.x = armAngle;
                rightArm.rotation.x = -armAngle;
                leftLeg.rotation.x = legAngle;
                rightLeg.rotation.x = -legAngle;

                torsoMesh.rotation.x = 0.1; 
                headMesh.position.y = 1.5 + Math.sin(animTime * 2) * 0.05;
            } else {
                animTime += 0.03;
                leftArm.rotation.x = Math.sin(animTime) * 0.05;
                rightArm.rotation.x = -Math.sin(animTime) * 0.05;
                leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                torsoMesh.rotation.x = 0;
                headMesh.position.y = 1.5 + Math.sin(animTime) * 0.02;
            }
        }

        function spawnDustParticles(x, y, z) {
            for(let i=0; i<6; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshBasicMaterial({ color: 0x94a3b8 }));
                p.position.set(x + (Math.random()-0.5)*0.5, y, z + (Math.random()-0.5)*0.5);
                scene.add(p);
                particlesArr.push({ mesh: p, life: 1.0, vy: Math.random()*0.02 });
            }
        }

        function updateParticles() {
            for(let i = particlesArr.length - 1; i >= 0; i--) {
                let p = particlesArr[i];
                p.mesh.position.y += p.vy;
                p.life -= 0.05;
                p.mesh.scale.multiplyScalar(0.92);
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    particlesArr.splice(i, 1);
                }
            }
        }

        function createStylizedPlatform(x, y, z, w, h, d, colorHex, type = 'normal') {
            const group = new THREE.Group();

            const mainMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.1 });
            const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mainMat);
            mainMesh.receiveShadow = true; mainMesh.castShadow = true;
            group.add(mainMesh);

            const borderMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const topBorder = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.1, d + 0.1), borderMat);
            topBorder.position.y = h / 2 + 0.05;
            group.add(topBorder);

            group.position.set(x, y, z);
            scene.add(group);

            platforms.push({ 
                mesh: mainMesh, group: group, type: type, 
                size: { w, h, d }, pos: { x, y, z }
            });
        }

        // بناء خريطة باركور أصعب مع مسافات أبعد
        function buildHorizontalLevel(levelNum) {
            platforms.forEach(p => scene.remove(p.group));
            traps.forEach(t => scene.remove(t.mesh));
            coinsArr.forEach(cn => scene.remove(cn.mesh));
            if (key1Obj) scene.remove(key1Obj);
            if (roomDoorObj) scene.remove(roomDoorObj);

            platforms = []; traps = []; coinsArr = [];
            hasKey1 = false; updateHUDKeys();

            const mapLength = 25 + Math.floor(levelNum * 1.5);
            let currentZ = 0, currentY = 0, currentX = 0;

            createStylizedPlatform(0, 0, 0, 10, 1.2, 10, 0x1e293b);

            for (let i = 0; i < mapLength; i++) {
                // تكبير الفجوات والمسافات لإعطاء تحدي قفز باركور حقيقي
                const gapZ = 6.0 + (levelNum * 0.08); 
                const stepY = (Math.sin(i * 0.5) * 0.9); 
                const shiftX = (Math.cos(i * 0.6) * 4.2); 

                currentZ -= gapZ; currentY += stepY; currentX = shiftX;

                // تصغير المنصات مع زيادة الصعوبة
                const pWidth = Math.max(3.2, 6.0 - (levelNum * 0.1));
                let platColor = 0x334155;
                let type = 'normal';

                if (i % 4 === 0) { type = 'ice'; platColor = 0x0284c7; }
                else if (i % 5 === 0) { type = 'jumppad'; platColor = 0x16a34a; }

                createStylizedPlatform(currentX, currentY, currentZ, pWidth, 1.2, pWidth, platColor, type);

                if (i % 2 === 0) createCoin(currentX, currentY + 1.6, currentZ);
                if (i % 4 === 1) createLaserTrap(currentX, currentY + 1.3, currentZ);
            }

            createKey1(currentX, currentY + 2, currentZ);
            createEndRoomWithPortal(currentX, currentY, currentZ - 12);
        }

        function createCoin(x, y, z) {
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.1, 10), new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8, roughness: 0.2 }));
            mesh.rotation.x = Math.PI / 2;
            mesh.position.set(x, y, z);
            scene.add(mesh);
            coinsArr.push({ mesh, collected: false });
        }

        function createLaserTrap(x, y, z) {
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 4, 6), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            mesh.rotation.z = Math.PI / 2;
            mesh.position.set(x, y, z);
            scene.add(mesh);
            traps.push({ mesh });
        }

        function createKey1(x, y, z) {
            const group = new THREE.Group(); group.position.set(x, y, z);
            group.add(new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.1, 8, 12), new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.1 })));
            key1Obj = group; scene.add(key1Obj);
        }

        function createEndRoomWithPortal(x, y, z) {
            roomDoorObj = new THREE.Group();
            roomDoorObj.position.set(x, y, z);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 });
            const floor = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 12), new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.4 }));
            floor.position.set(0, 0, 0); floor.receiveShadow = true;

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 0.8), wallMat); backWall.position.set(0, 4, -6);
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 12), wallMat); leftWall.position.set(-6, 4, 0);
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 12), wallMat); rightWall.position.set(6, 4, 0);

            const portalGeo = new THREE.TorusGeometry(2.0, 0.25, 12, 24);
            const portalMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
            portalRingMesh = new THREE.Mesh(portalGeo, portalMat);
            portalRingMesh.position.set(0, 3.5, -4);

            const portalCenter = new THREE.Mesh(new THREE.CircleGeometry(1.9, 20), new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide }));
            portalCenter.position.set(0, 3.5, -4); portalCenter.name = "finish";

            roomDoorObj.add(floor, backWall, leftWall, rightWall, portalRingMesh, portalCenter);
            scene.add(roomDoorObj);
        }

        function triggerDash() {
            if (!canDash || isDashing || isDying) return;
            canDash = false; isDashing = true;
            playSound(600, 'sawtooth', 0.1);
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            velocity.x = forward.x * 0.58; velocity.z = forward.z * 0.58;
            showToast("⚡ اندفاع الباركور!");
            setTimeout(() => { isDashing = false; }, 220);
            setTimeout(() => { canDash = true; }, 1000);
        }

        function startGame() {
            initAudio();
            const name = document.getElementById('player-name-input').value || "الباركور";
            currentLevel = parseInt(document.getElementById('level-select').value);

            document.getElementById('hud-name').textContent = name;
            document.getElementById('hud-level').textContent = currentLevel;
            document.getElementById('menu').style.display = 'none';

            if (!scene) initScene();

            createCustomPlayer();
            buildHorizontalLevel(currentLevel);
            
            respawnPlayer();
            animate();
        }

        function triggerDeathAnimation() {
            if (isDying) return;
            isDying = true; deathCount++;
            playSound(150, 'sawtooth', 0.3);
            document.getElementById('hud-deaths').textContent = deathCount;
            playerGroup.visible = false;
            
            setTimeout(() => {
                isDying = false; playerGroup.visible = true;
                respawnPlayer();
            }, 500);
        }

        function respawnPlayer() {
            playerGroup.position.set(0, 3, 0);
            velocity = { x: 0, y: 0, z: 0 };
            playerGroup.rotation.y = 0;
        }

        function showToast(text) {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text; msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 1800);
        }

        function updateHUDKeys() {
            document.getElementById('hud-key1').textContent = hasKey1 ? "✔️" : "❌";
            document.getElementById('hud-key1').style.color = hasKey1 ? "#4ade80" : "#ef4444";
        }

        function openWinModal() {
            confetti({ particleCount: 100, spread: 70 });
            playSound(580, 'sine', 0.4);
            localStorage.setItem('r4d_level', Math.min(30, currentLevel + 1));
            document.getElementById('win-modal').style.display = 'block';
        }

        function nextLevelAction() {
            document.getElementById('win-modal').style.display = 'none';
            if (currentLevel < 30) {
                currentLevel++;
                document.getElementById('hud-level').textContent = currentLevel;
                buildHorizontalLevel(currentLevel);
                respawnPlayer();
            } else {
                document.getElementById('menu').style.display = 'block';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isDying) { renderer.render(scene, camera); return; }

            if (portalRingMesh) portalRingMesh.rotation.z += 0.03;

            updateParticles();

            // تسارع وتسارع الباركور المتقدم
            targetVelocity.x = 0; targetVelocity.z = 0;
            let moveSpeed = isOnIce ? baseSpeed * 1.3 : baseSpeed;

            if (keys['arrowleft'] || keys['a']) targetVelocity.x = -moveSpeed;
            if (keys['arrowright'] || keys['d']) targetVelocity.x = moveSpeed;
            if (keys['arrowup'] || keys['w']) targetVelocity.z = -moveSpeed;
            if (keys['arrowdown'] || keys['s']) targetVelocity.z = moveSpeed;

            velocity.x += (targetVelocity.x - velocity.x) * (isOnIce ? 0.04 : 0.28);
            velocity.z += (targetVelocity.z - velocity.z) * (isOnIce ? 0.04 : 0.28);

            if (Math.abs(velocity.x) > 0.02 || Math.abs(velocity.z) > 0.02) {
                playerGroup.rotation.y = Math.atan2(-velocity.x, -velocity.z);
            }

            velocity.y -= gravity;
            playerGroup.position.x += velocity.x;
            playerGroup.position.y += velocity.y;
            playerGroup.position.z += velocity.z;

            updatePlayerAnimations();

            // تصادم فيزيائي متقن للباركور
            isGrounded = false; isOnIce = false;
            const playerFeetY = playerGroup.position.y - 0.75;
            const playerX = playerGroup.position.x;
            const playerZ = playerGroup.position.z;

            for (let p of platforms) {
                const halfW = p.size.w / 2 + 0.25;
                const halfD = p.size.d / 2 + 0.25;
                const topY = p.pos.y + p.size.h / 2;

                if (playerX >= p.pos.x - halfW && playerX <= p.pos.x + halfW &&
                    playerZ >= p.pos.z - halfD && playerZ <= p.pos.z + halfD) {
                    
                    if (velocity.y <= 0 && playerFeetY <= topY && playerFeetY >= topY - 0.5) {
                        if (!isGrounded) spawnDustParticles(playerX, topY, playerZ);
                        playerGroup.position.y = topY + 0.75;
                        velocity.y = 0;
                        isGrounded = true;
                        jumpsLeft = maxJumps;

                        if (p.type === 'ice') isOnIce = true;
                        if (p.type === 'jumppad') { 
                            velocity.y = jumpForce * 1.7; 
                            playSound(500, 'square', 0.2);
                            showToast("🚀 قفزة قوية!"); 
                        }
                    }
                }
            }

            // المقتنيات والتصادمات
            coinsArr.forEach(c => {
                c.mesh.rotation.z += 0.05;
                if (!c.collected && playerGroup.position.distanceTo(c.mesh.position) < 1.2) {
                    c.collected = true; scene.remove(c.mesh);
                    coinsCount += 10; document.getElementById('hud-coins').textContent = coinsCount;
                    playSound(800, 'sine', 0.15);
                }
            });

            traps.forEach(trap => {
                if (playerGroup.position.distanceTo(trap.mesh.position) < 1.4) triggerDeathAnimation();
            });

            if (key1Obj && !hasKey1) {
                key1Obj.rotation.y += 0.04;
                if (playerGroup.position.distanceTo(key1Obj.position) < 1.5) {
                    hasKey1 = true; scene.remove(key1Obj); updateHUDKeys();
                    playSound(700, 'triangle', 0.25);
                    showToast("🔑 جمعت المفتاح!");
                }
            }

            if (playerGroup.position.y < -14) triggerDeathAnimation();

            const finishObj = scene.getObjectByName("finish");
            if (finishObj) {
                const finishWorldPos = new THREE.Vector3();
                finishObj.getWorldPosition(finishWorldPos);
                if (playerGroup.position.distanceTo(finishWorldPos) < 2.0) {
                    openWinModal(); playerGroup.position.z -= 2;
                }
            }

            // كاميرا متتبعة ديناميكية
            camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1;
            camera.position.y += (playerGroup.position.y + 4.2 - camera.position.y) * 0.1;
            camera.position.z += (playerGroup.position.z + 10.0 - camera.position.z) * 0.1;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z - 2);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
