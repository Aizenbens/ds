<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>From What?</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { margin: 0; overflow: hidden; background: #020208; user-select: none; touch-action: none; }
        
        #menu {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 20px;
            border-radius: 24px; color: #f8fafc; text-align: center;
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.5);
            border: 2px solid rgba(220, 38, 38, 0.6);
            z-index: 10; width: 92%; max-width: 460px; max-height: 95vh; overflow-y: auto;
            backdrop-filter: blur(16px); display: flex; flex-direction: column; gap: 10px;
        }

        #menu h1 { margin: 0; color: #ef4444; text-shadow: 0 0 12px #991b1b; font-size: 26px; font-weight: 900; }
        
        .preview-container {
            width: 100%; height: 150px; background: #05070f; border-radius: 16px;
            border: 1px solid #1e293b; position: relative; overflow: hidden;
        }

        .tabs { display: flex; gap: 8px; justify-content: center; }
        .tab-btn {
            flex: 1; padding: 8px; background: #1e293b; color: #94a3b8;
            border: 1px solid #334155; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: #ef4444; color: white; border-color: #f87171; }

        .form-group { text-align: right; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; color: #94a3b8; font-size: 12px; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #334155;
            background: #0f172a; color: white; font-size: 13px; outline: none;
        }

        .color-row { display: flex; gap: 8px; }
        .color-row div { flex: 1; }

        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 5px; }
        .shop-card {
            background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px;
        }
        .shop-card button {
            background: #22c55e; border: none; color: white; padding: 4px 8px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 10px; width: 100%;
        }

        button.btn-main {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white; border: none; padding: 12px; border-radius: 12px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        #hud {
            position: absolute; top: 12px; right: 12px; left: 12px;
            display: flex; justify-content: space-between; pointer-events: none;
            color: white; font-size: 12px; font-weight: bold; z-index: 5; flex-wrap: wrap; gap: 8px;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); padding: 6px 12px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px;
        }

        #action-btn-container {
            position: absolute; bottom: 15px; left: 15px; z-index: 6;
            display: flex; gap: 8px;
        }

        .action-btn {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #ef4444;
            color: white; padding: 10px 16px; border-radius: 12px;
            font-size: 13px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px);
        }

        #win-modal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); padding: 25px;
            border-radius: 20px; color: white; text-align: center;
            border: 2px solid #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            z-index: 20; width: 85%; max-width: 340px;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 4;
            border: 2px solid rgba(255,255,255,0.7); border-radius: 50%;
        }

        #toast-msg {
            position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%);
            color: #facc15; font-size: 14px; font-weight: bold; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none;
            background: rgba(15, 23, 42, 0.95); padding: 10px 20px; border-radius: 10px;
            border: 1px solid rgba(250, 204, 21, 0.5); z-index: 6; text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="menu">
        <h1>🔥 From What? 🔥</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('custom')">التخصيص</button>
            <button class="tab-btn" onclick="switchTab('shop')">المتجر 🛒</button>
        </div>

        <div class="preview-container" id="shop-preview"></div>

        <div id="tab-custom">
            <div class="color-row">
                <div class="form-group">
                    <label>القميص:</label>
                    <input type="color" id="shirt-color-input" value="#0284c7" onchange="updateShopPreview()">
                </div>
                <div class="form-group">
                    <label>السروال:</label>
                    <input type="color" id="pants-color-input" value="#1e3a8a" onchange="updateShopPreview()">
                </div>
                <div class="form-group">
                    <label>البشرة:</label>
                    <input type="color" id="skin-color-input" value="#fca5a5" onchange="updateShopPreview()">
                </div>
            </div>

            <div class="color-row">
                <div class="form-group">
                    <label>المستوى (1 - 40):</label>
                    <select id="level-select"></select>
                </div>
            </div>
        </div>

        <div id="tab-shop" style="display: none;">
            <div class="shop-grid">
                <div class="shop-card">
                    <span>🔥 سكن الحمم</span>
                    <span>100 عملة</span>
                    <button onclick="buySkin('lava', 100)">شراء / تجهيز</button>
                </div>
                <div class="shop-card">
                    <span>⚡ سكن البرق</span>
                    <span>250 عملة</span>
                    <button onclick="buySkin('lightning', 250)">شراء / تجهيز</button>
                </div>
                <div class="shop-card">
                    <span>🗿 سكن الصخر</span>
                    <span>400 عملة</span>
                    <button onclick="buySkin('rock', 400)">شراء / تجهيز</button>
                </div>
            </div>
        </div>

        <button class="btn-main" onclick="startGame()">ابدأ المغامرة 🏃‍♂️🔥</button>
    </div>

    <div id="hud">
        <div class="hud-card">🔑 المفتاح: <span id="hud-key" style="color: #ef4444;">مفقود ❌</span></div>
        <div class="hud-card">💰 <span id="hud-coins" style="color: #facc15;">0</span></div>
        <div class="hud-card">💀 <span id="hud-deaths" style="color: #ef4444;">0</span></div>
        <div class="hud-card">📍 مرحلة: <span id="hud-level" style="color: #facc15;">1</span> / 40</div>
    </div>

    <div id="action-btn-container">
        <button class="action-btn" onclick="triggerDash()">⚡ اندفاع (Shift)</button>
    </div>

    <div id="win-modal">
        <h2>🏆 فتحت الباب وهربت!</h2>
        <p>اجتزت الألغاز والفخاخ بنجاح!</p>
        <button class="btn-main" onclick="nextLevelAction()">المرحلة التالية ⏩</button>
    </div>

    <div id="toast-msg"></div>

    <script>
        let savedLevel = parseInt(localStorage.getItem('fw_level')) || 1;
        let savedCoins = parseInt(localStorage.getItem('fw_coins')) || 0;
        let ownedSkins = JSON.parse(localStorage.getItem('fw_skins')) || ['default'];
        let equippedSkin = localStorage.getItem('fw_equipped_skin') || 'default';

        const levelSelect = document.getElementById('level-select');
        for (let i = 1; i <= 40; i++) {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = i <= 30 ? `باركور ${i}` : `متاهة وألغاز ${i - 30}`;
            if (i === savedLevel) opt.selected = true;
            levelSelect.appendChild(opt);
        }

        let scene, camera, renderer;
        let previewScene, previewCamera, previewRenderer, previewPlayerGroup;
        let playerGroup, torchLight, torchSpot, ambientLight;
        let monsterGroup = null;
        let platforms = [], obstacles = [], traps = [], keyMesh = null, doorMesh = null;
        
        let hasKey = false;
        let deathCount = 0, coinsCount = savedCoins;
        let isDying = false;
        
        let currentLevel = savedLevel;
        let isGrounded = false;
        let jumpsLeft = 2; const maxJumps = 2;
        let canDash = true;

        let audioCtx = null;
        const gravity = 0.016;
        let velocity = { x: 0, y: 0, z: 0 };
        let baseSpeed = 0.20;
        let jumpForce = 0.38;
        let monsterSpeed = 0.15;
        const keys = {};

        let pitch = 0, yaw = 0;
        const playerRadius = 0.4; 

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function switchTab(tab) {
            document.getElementById('tab-custom').style.display = tab === 'custom' ? 'block' : 'none';
            document.getElementById('tab-shop').style.display = tab === 'shop' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function buySkin(skinName, cost) {
            if (ownedSkins.includes(skinName)) {
                equippedSkin = skinName;
                localStorage.setItem('fw_equipped_skin', equippedSkin);
                showToast("تم تجهيز السكن!");
                updateShopPreview();
                return;
            }

            if (coinsCount >= cost) {
                coinsCount -= cost;
                ownedSkins.push(skinName);
                equippedSkin = skinName;
                localStorage.setItem('fw_coins', coinsCount);
                localStorage.setItem('fw_skins', JSON.stringify(ownedSkins));
                localStorage.setItem('fw_equipped_skin', equippedSkin);
                document.getElementById('hud-coins').textContent = coinsCount;
                showToast("مبروك! تم شراء السكن 🎉");
                updateShopPreview();
            } else {
                showToast("العملات غير كافية!");
            }
        }

        function initShopPreview() {
            const container = document.getElementById('shop-preview');
            previewScene = new THREE.Scene();
            previewScene.background = new THREE.Color(0x05070f);

            previewCamera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
            previewCamera.position.set(0, 1.3, 3.2);

            previewRenderer = new THREE.WebGLRenderer({ antialias: true });
            previewRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(previewRenderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(2, 4, 3);
            previewScene.add(light);
            previewScene.add(new THREE.AmbientLight(0xffffff, 0.6));

            updateShopPreview();
            animateShopPreview();
        }

        function buildMinecraftPlayerMesh() {
            const group = new THREE.Group();
            let skinColor = document.getElementById('skin-color-input').value;
            let shirtColor = document.getElementById('shirt-color-input').value;
            let pantsColor = document.getElementById('pants-color-input').value;

            if (equippedSkin === 'lava') { skinColor = "#ef4444"; shirtColor = "#7f1d1d"; pantsColor = "#450a0a"; }
            else if (equippedSkin === 'lightning') { skinColor = "#38bdf8"; shirtColor = "#0284c7"; pantsColor = "#0f172a"; }
            else if (equippedSkin === 'rock') { skinColor = "#94a3b8"; shirtColor = "#475569"; pantsColor = "#1e293b"; }

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: skinColor }));
            head.position.y = 1.5;

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.35), new THREE.MeshStandardMaterial({ color: shirtColor }));
            torso.position.y = 0.8;

            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: pantsColor }));
            leftLeg.position.set(-0.16, 0.0, 0);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.3), new THREE.MeshStandardMaterial({ color: pantsColor }));
            rightLeg.position.set(0.16, 0.0, 0);

            group.add(head, torso, leftLeg, rightLeg);
            return group;
        }

        function updateShopPreview() {
            if (previewPlayerGroup) previewScene.remove(previewPlayerGroup);
            previewPlayerGroup = buildMinecraftPlayerMesh();
            previewScene.add(previewPlayerGroup);
        }

        function animateShopPreview() {
            requestAnimationFrame(animateShopPreview);
            if (previewPlayerGroup) previewPlayerGroup.rotation.y += 0.02;
            if (previewRenderer) previewRenderer.render(previewScene, previewCamera);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010103);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(0xffffff, 0.08);
            scene.add(ambientLight);

            // زيادة السطوع ومدى إضاءة الشمعة/الشعلة
            torchLight = new THREE.PointLight(0xffaa33, 4.5, 35);
            scene.add(torchLight);

            torchSpot = new THREE.SpotLight(0xffcc66, 6.0, 45, Math.PI / 4, 0.5);
            scene.add(torchSpot);
            scene.add(torchSpot.target);

            document.body.addEventListener('click', () => {
                if (document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.0025;
                    pitch -= e.movementY * 0.0025;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                }
            });

            // دعم مفاتيح WASD والأسهم
            window.addEventListener('keydown', e => {
                initAudio();
                const key = e.key.toLowerCase();
                keys[key] = true;
                if (e.code === 'ShiftLeft' || key === 'shift') triggerDash();
                if (e.code === 'Space' && !isDying) simulateJump();
            });

            window.addEventListener('keyup', e => {
                keys[e.key.toLowerCase()] = false;
            });

            window.addEventListener('resize', onWindowResize);
        }

        function simulateJump() {
            if (isGrounded) {
                velocity.y = jumpForce; isGrounded = false; jumpsLeft = maxJumps - 1;
                playSound(320, 'square', 0.15);
            } else if (jumpsLeft > 0) {
                velocity.y = jumpForce * 0.85; jumpsLeft--;
                playSound(450, 'triangle', 0.2);
            }
        }

        function createChasingMonster() {
            if (monsterGroup) scene.remove(monsterGroup);
            monsterGroup = new THREE.Group();

            const mat = new THREE.MeshStandardMaterial({ color: 0x220303, roughness: 0.2, emissive: 0x330000 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.8, 1.8), mat); body.position.y = 1.9;
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), mat); head.position.y = 4.2;

            const hornMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b });
            const horn1 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.2, 4), hornMat);
            horn1.position.set(-0.5, 5.2, 0); horn1.rotation.z = -0.3;

            const horn2 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.2, 4), hornMat);
            horn2.position.set(0.5, 5.2, 0); horn2.rotation.z = 0.3;

            const eyes = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            eyes.position.set(0, 4.3, -0.72);

            monsterGroup.add(body, head, horn1, horn2, eyes);
            monsterGroup.position.set(0, 0, 14);
            scene.add(monsterGroup);

            monsterSpeed = 0.14 + (currentLevel * 0.002);
        }

        function createWallOrPlatform(x, y, z, w, h, d, colorHex, isWall = false) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7 })
            );
            mesh.position.set(x, y, z);
            scene.add(mesh);

            const boundingBox = new THREE.Box3().setFromObject(mesh);
            const objData = { mesh, box: boundingBox, min: boundingBox.min, max: boundingBox.max, isWall };

            if (isWall) obstacles.push(objData);
            else platforms.push(objData);

            return mesh;
        }

        function createTrapSpike(x, y, z) {
            const spike = new THREE.Mesh(
                new THREE.ConeGeometry(0.4, 1.2, 4),
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 })
            );
            spike.position.set(x, y + 0.6, z);
            scene.add(spike);
            traps.push(spike);
        }

        function buildMazeLevel(levelNum) {
            ambientLight.intensity = 0.03;
            scene.fog = new THREE.FogExp2(0x010103, 0.06);

            const unit = 5;
            const mazeSize = 8 + (levelNum - 30);

            // بناء المتاهة والأرضية
            createWallOrPlatform(0, -0.5, 0, mazeSize * unit, 1, mazeSize * unit, 0x1e293b);

            for (let r = 0; r < mazeSize; r++) {
                for (let c = 0; c < mazeSize; c++) {
                    let rx = (r - mazeSize / 2) * unit;
                    let rz = (c - mazeSize / 2) * unit;

                    if (r === 0 || c === 0 || r === mazeSize - 1 || c === mazeSize - 1 || Math.random() > 0.5) {
                        createWallOrPlatform(rx, 3, rz, unit, 6, unit, 0x0f172a, true);
                    } else if (Math.random() < 0.2) {
                        createTrapSpike(rx, 0, rz);
                    }
                }
            }

            // إضافة المفتاح
            keyMesh = new THREE.Mesh(
                new THREE.TorusGeometry(0.4, 0.1, 8, 16),
                new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04 })
            );
            keyMesh.position.set((mazeSize / 3) * unit, 1.2, (mazeSize / 3) * unit);
            scene.add(keyMesh);

            // إضافة الباب المغلق المخرج
            doorMesh = new THREE.Mesh(
                new THREE.BoxGeometry(unit, 6, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.3 })
            );
            doorMesh.position.set(0, 3, -(mazeSize / 2) * unit + 2);
            scene.add(doorMesh);
            
            const doorBox = new THREE.Box3().setFromObject(doorMesh);
            obstacles.push({ mesh: doorMesh, box: doorBox, min: doorBox.min, max: doorBox.max, isDoor: true });

            showToast("💡 ابحث عن المفتاح الذهبي 🔑 لفتح الباب والهروب!");
        }

        function buildCaveLevel(levelNum) {
            platforms.forEach(p => scene.remove(p.mesh));
            obstacles.forEach(o => scene.remove(o.mesh));
            traps.forEach(t => scene.remove(t));
            if (keyMesh) scene.remove(keyMesh);
            if (doorMesh) scene.remove(doorMesh);

            platforms = []; obstacles = []; traps = []; hasKey = false;
            document.getElementById('hud-key').textContent = "مفقود ❌";
            document.getElementById('hud-key').style.color = "#ef4444";

            if (levelNum > 30) {
                buildMazeLevel(levelNum);
                createChasingMonster();
                return;
            }

            ambientLight.intensity = 0.25;
            scene.fog = new THREE.FogExp2(0x020208, 0.02);

            const mapLength = 20 + Math.floor(levelNum * 1.5);
            let currentZ = 0, currentY = 0, currentX = 0;

            createWallOrPlatform(0, 0, 0, 8, 1.4, 8, 0x1e293b);

            for (let i = 0; i < mapLength; i++) {
                const gapZ = 6.5 + (levelNum * 0.05); 
                const stepY = (Math.sin(i * 0.6) * 1.0); 
                const shiftX = (Math.cos(i * 0.7) * 4.0); 

                currentZ -= gapZ; currentY += stepY; currentX = shiftX;

                const pWidth = Math.max(3.0, 5.0 - (levelNum * 0.06));
                createWallOrPlatform(currentX, currentY, currentZ, pWidth, 1.2, pWidth, 0x1e293b);
            }

            // نهاية المرحلة العادية
            createWallOrPlatform(currentX, currentY, currentZ - 8, 10, 1.4, 10, 0x1e1b4b);
            
            const portal = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.25, 12, 24), new THREE.MeshBasicMaterial({ color: 0x22c55e }));
            portal.position.set(currentX, currentY + 3.2, currentZ - 8); portal.name = "finish";
            scene.add(portal);

            createChasingMonster();
        }

        function triggerDash() {
            if (!canDash || isDying) return;
            canDash = false;
            playSound(600, 'sawtooth', 0.1);
            velocity.z -= 0.55;
            setTimeout(() => { canDash = true; }, 1000);
        }

        function startGame() {
            initAudio();
            currentLevel = parseInt(document.getElementById('level-select').value);

            document.getElementById('hud-level').textContent = currentLevel;
            document.getElementById('hud-coins').textContent = coinsCount;
            document.getElementById('menu').style.display = 'none';

            if (!scene) initScene();

            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            buildCaveLevel(currentLevel);
            respawnPlayer();
            animate();
        }

        function triggerDeathAnimation() {
            if (isDying) return;
            isDying = true; deathCount++;
            playSound(150, 'sawtooth', 0.3);
            document.getElementById('hud-deaths').textContent = deathCount;
            
            setTimeout(() => {
                isDying = false;
                respawnPlayer();
            }, 300);
        }

        function respawnPlayer() {
            playerGroup.position.set(0, 2.5, 0);
            velocity = { x: 0, y: 0, z: 0 };
            yaw = 0; pitch = 0;
            if (monsterGroup) monsterGroup.position.set(0, 0, 14);
        }

        function showToast(text) {
            const msg = document.getElementById('toast-msg');
            msg.textContent = text; msg.style.opacity = '1';
            setTimeout(() => msg.style.opacity = '0', 2500);
        }

        function openWinModal() {
            confetti({ particleCount: 100, spread: 70 });
            playSound(580, 'sine', 0.4);
            localStorage.setItem('fw_level', Math.min(40, currentLevel + 1));
            document.exitPointerLock();
            document.getElementById('win-modal').style.display = 'block';
        }

        function nextLevelAction() {
            document.getElementById('win-modal').style.display = 'none';
            if (currentLevel < 40) {
                currentLevel++;
                document.getElementById('hud-level').textContent = currentLevel;
                buildCaveLevel(currentLevel);
                respawnPlayer();
            } else {
                document.getElementById('menu').style.display = 'flex';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isDying) { renderer.render(scene, camera); return; }

            const time = Date.now() * 0.003;

            // حركة وحش المتاهة
            if (monsterGroup && playerGroup) {
                monsterGroup.position.z -= monsterSpeed;
                monsterGroup.position.x += (playerGroup.position.x - monsterGroup.position.x) * 0.02;
                monsterGroup.position.y = playerGroup.position.y - 0.2;

                if (playerGroup.position.distanceTo(monsterGroup.position) < 2.0) {
                    showToast("👹 ألمحك الشيطان وقتلك!");
                    triggerDeathAnimation();
                }
            }

            // التقاط المفتاح
            if (keyMesh && playerGroup.position.distanceTo(keyMesh.position) < 2.0 && !hasKey) {
                hasKey = true;
                scene.remove(keyMesh);
                document.getElementById('hud-key').textContent = "تم العثور عليه 🔑";
                document.getElementById('hud-key').style.color = "#22c55e";
                playSound(800, 'sine', 0.2);
                showToast("🔑 حصلت على المفتاح! اذهب إلى الباب الآن.");
            }

            // فحص الاصطدام بالفخاخ
            for (let trap of traps) {
                if (playerGroup.position.distanceTo(trap.position) < 1.2) {
                    showToast("⚠️ وقعت في الفخ!");
                    triggerDeathAnimation();
                }
            }

            // دعم الحركة بحروف WASD والأسهم
            targetVelocity = { x: 0, z: 0 };
            let moveSpeed = baseSpeed;

            if (keys['arrowleft'] || keys['a']) targetVelocity.x = -moveSpeed;
            if (keys['arrowright'] || keys['d']) targetVelocity.x = moveSpeed;
            if (keys['arrowup'] || keys['w']) targetVelocity.z = -moveSpeed;
            if (keys['arrowdown'] || keys['s']) targetVelocity.z = moveSpeed;

            const cos = Math.cos(yaw);
            const sin = Math.sin(yaw);

            let vx = targetVelocity.x * cos - targetVelocity.z * sin;
            let vz = targetVelocity.x * sin + targetVelocity.z * cos;

            velocity.x += (vx - velocity.x) * 0.3;
            velocity.z += (vz - velocity.z) * 0.3;
            velocity.y -= gravity;

            // نظام تصادم محدد مانع لاختراق الحيطان (Wall Collision Handling)
            let oldX = playerGroup.position.x;
            let oldY = playerGroup.position.y;
            let oldZ = playerGroup.position.z;

            let newX = oldX + velocity.x;
            let newY = oldY + velocity.y;
            let newZ = oldZ + velocity.z;

            // فحص الجدران والعوائق الأفقية (X and Z)
            for (let obs of obstacles) {
                if (obs.isDoor && hasKey && playerGroup.position.distanceTo(doorMesh.position) < 3.0) {
                    openWinModal();
                    return;
                }

                if (newX + playerRadius > obs.min.x && newX - playerRadius < obs.max.x &&
                    oldZ + playerRadius > obs.min.z && oldZ - playerRadius < obs.max.z &&
                    oldY + 1.8 > obs.min.y && oldY < obs.max.y) {
                    newX = oldX; velocity.x = 0;
                }

                if (oldX + playerRadius > obs.min.x && oldX - playerRadius < obs.max.x &&
                    newZ + playerRadius > obs.min.z && newZ - playerRadius < obs.max.z &&
                    oldY + 1.8 > obs.min.y && oldY < obs.max.y) {
                    newZ = oldZ; velocity.z = 0;
                }
            }

            // فحص الأرضيات والمنصات (Y Axis)
            isGrounded = false;
            for (let plat of platforms) {
                if (newX + playerRadius > plat.min.x && newX - playerRadius < plat.max.x &&
                    newZ + playerRadius > plat.min.z && newZ - playerRadius < plat.max.z) {
                    
                    if (velocity.y <= 0 && oldY >= plat.max.y - 0.2 && newY <= plat.max.y + 0.1) {
                        newY = plat.max.y;
                        velocity.y = 0;
                        isGrounded = true;
                        jumpsLeft = maxJumps;
                    }
                }
            }

            playerGroup.position.set(newX, newY, newZ);

            // موقع الكاميرا وإحداثيات الشمعة المضيئة
            const headBob = isGrounded && (Math.abs(velocity.x) > 0.05 || Math.abs(velocity.z) > 0.05) ? Math.sin(time * 12) * 0.06 : 0;
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 1.5 + headBob, playerGroup.position.z);

            if (torchLight && torchSpot) {
                torchLight.position.set(camera.position.x, camera.position.y - 0.2, camera.position.z);
                torchLight.intensity = 4.0 + Math.sin(time * 18) * 0.5;

                torchSpot.position.copy(camera.position);
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                torchSpot.target.position.copy(camera.position).add(dir);
            }

            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.x = pitch; euler.y = yaw;
            camera.quaternion.setFromEuler(euler);

            if (playerGroup.position.y < -12) triggerDeathAnimation();

            const finishObj = scene.getObjectByName("finish");
            if (finishObj && playerGroup.position.distanceTo(finishObj.position) < 2.5) {
                openWinModal();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initShopPreview;
    </script>
</body>
</html>
